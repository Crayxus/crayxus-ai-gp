<style>
:root{
  --bg:#fbfaf9; --ink:#15120e; --body:#4b453d; --dim:#8d857a;
  --line:#e7e1d9; --hot:#cf4f19; --soft:#f6f2ed; --ok:#3f7d4e;
  --no:#b8493a; --mid:#a8823a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1011; --ink:#f2eee9; --body:#a9a39b; --dim:#756e66;
    --line:#26282a; --hot:#f57a4c; --soft:#191a1c; --ok:#6bb37d;
    --no:#e0705f; --mid:#d6ad5c;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1011; --ink:#f2eee9; --body:#a9a39b; --dim:#756e66;
  --line:#26282a; --hot:#f57a4c; --soft:#191a1c; --ok:#6bb37d;
  --no:#e0705f; --mid:#d6ad5c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--body);
  font-family:"Source Han Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  font-size:17.5px;line-height:1.9;-webkit-font-smoothing:antialiased}

/* ===== 锁屏 ===== */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px}
#lock .box{width:100%;max-width:400px;text-align:center}
#lock .ic{font-size:13px;letter-spacing:.3em;color:var(--hot);font-weight:700;margin-bottom:26px}
#lock h1{font-size:25px;color:var(--ink);font-weight:700;line-height:1.45;
  margin-bottom:12px;letter-spacing:-.01em}
#lock .sub{font-size:14.5px;color:var(--dim);line-height:1.8;margin-bottom:34px}
#lock .row{display:flex;gap:9px}
#lock input{flex:1;min-width:0;background:transparent;border:1px solid var(--line);
  border-radius:2px;padding:12px 14px;font-size:16px;color:var(--ink);
  font-family:inherit;outline:none;transition:border-color .15s}
#lock input:focus{border-color:var(--hot)}
#lock button{background:var(--ink);color:var(--bg);border:none;border-radius:2px;
  padding:12px 22px;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
  white-space:nowrap;transition:opacity .15s}
#lock button:hover{opacity:.85}
#lock button:disabled{opacity:.45;cursor:default}
#lock .msg{margin-top:16px;font-size:14px;min-height:22px;color:var(--no)}
#lock .msg.busy{color:var(--dim)}
#lock .foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--dim);line-height:1.85}

/* ===== 正文 ===== */
#doc{display:none}
.wrap{max-width:740px;margin:0 auto;padding:74px 32px 130px}
.top{font-size:11.5px;letter-spacing:.3em;color:var(--hot);font-weight:700;margin-bottom:16px}
h1{font-size:36px;line-height:1.3;color:var(--ink);font-weight:700;
  letter-spacing:-.02em;margin-bottom:10px}
.subtitle{font-size:15px;color:var(--dim);letter-spacing:.04em;margin-bottom:30px}
.lead{font-size:15.5px;color:var(--body);border-left:2px solid var(--line);
  padding-left:17px;line-height:1.85}

section{margin-bottom:74px}
.q{font-size:12.5px;letter-spacing:.2em;color:var(--dim);font-weight:600;margin-bottom:18px}
h2{font-size:28px;line-height:1.42;color:var(--ink);font-weight:700;
  letter-spacing:-.015em;text-wrap:balance;margin-bottom:17px}
h3{font-size:17.5px;color:var(--ink);font-weight:600;margin:36px 0 11px}
p{margin-bottom:14px}
p:last-child{margin-bottom:0}
b{color:var(--ink);font-weight:600}
ul{margin:14px 0 14px 22px}
ul li{margin-bottom:8px}
.note-p{font-size:15px;color:var(--dim)}

.line{height:1px;background:var(--line);margin:0 0 74px}

.hero{background:var(--soft);border-left:3px solid var(--hot);
  padding:26px 28px;margin:26px 0;font-size:21px;line-height:1.65;
  color:var(--ink);font-weight:600;text-wrap:balance}
.hero small{display:block;font-size:14px;font-weight:400;color:var(--dim);
  margin-top:12px;line-height:1.8}

/* 图 */
figure{margin:30px 0}
figure img{width:100%;height:auto;display:block;border-radius:3px;border:1px solid var(--line)}
figcaption{font-size:13.5px;color:var(--dim);margin-top:11px;line-height:1.75}
figcaption b{color:var(--ink);font-weight:600}
figure.annot .fw{position:relative;line-height:0}
figure.annot .fw svg{position:absolute;top:0;left:0;width:100%;height:100%}
.mk circle{fill:var(--hot);stroke:#fff;stroke-width:3.5;opacity:.96}
.mk text{fill:#fff;font-size:31px;font-weight:700;text-anchor:middle;
  dominant-baseline:central;font-family:"Source Han Sans SC","Microsoft YaHei",sans-serif}
ol.legend{list-style:none;margin:22px 0 0;padding:0;counter-reset:lg;
  display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
ol.legend li{counter-increment:lg;position:relative;padding:12px 0 12px 34px;
  border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.7;color:var(--body)}
ol.legend li::before{content:counter(lg);position:absolute;left:0;top:14px;
  width:22px;height:22px;border-radius:50%;background:var(--hot);color:#fff;
  font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
ol.legend li b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:2px}

/* 表 */
.tblwrap{overflow-x:auto;margin-top:26px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:520px}
th,td{border-bottom:1px solid var(--line);padding:13px 12px;text-align:left;vertical-align:top}
th{font-size:12px;letter-spacing:.1em;color:var(--dim);font-weight:600;white-space:nowrap}
th:first-child,td:first-child{padding-left:0}
td:first-child{color:var(--dim);font-size:14.5px}
td b{color:var(--ink)}
th.us,td.us{background:var(--soft)}
th.us{color:var(--hot)}
td.y{color:var(--ok);font-weight:600}
td.n{color:var(--dim)}
td.m{color:var(--mid)}
table.bom td:last-child,table.bom th:last-child{text-align:right;white-space:nowrap;
  font-variant-numeric:tabular-nums}
table.bom tr.sum td{border-top:1px solid var(--line);background:var(--soft)}
table.bom tr.total td{border-top:2px solid var(--ink);border-bottom:none;
  font-size:16.5px;color:var(--ink)}

/* 三层栈 */
.stack{margin-top:24px;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.stack div{padding:16px 20px;border-bottom:1px solid var(--line)}
.stack div:last-child{border-bottom:none}
.stack .l{font-size:11.5px;letter-spacing:.16em;color:var(--hot);font-weight:700;margin-bottom:4px}
.stack .t{font-size:15.5px;color:var(--ink);line-height:1.65}

/* 问题列表 */
.prob{margin-top:24px}
.prob>div{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.prob>div:last-child{border-bottom:none}
.prob .k{font-size:13px;font-weight:700;color:var(--hot);min-width:22px;padding-top:3px}
.prob .v{font-size:16.5px;color:var(--ink);font-weight:600;line-height:1.6}
.prob .v em{display:block;font-style:normal;font-size:15px;color:var(--body);
  font-weight:400;margin-top:5px;line-height:1.75}

/* 前后对照 */
.pair{margin-top:26px;border-top:1px solid var(--line)}
.pair div{padding:19px 0;border-bottom:1px solid var(--line)}
.pair .l{font-size:11.5px;letter-spacing:.16em;color:var(--dim);font-weight:600;margin-bottom:5px}
.pair .now .t{font-size:16.5px;color:var(--body)}
.pair .aim .l{color:var(--hot)}
.pair .aim .t{font-size:19px;color:var(--ink);font-weight:600}

/* 交付项 */
ol.deliv{margin:20px 0 0 22px}
ol.deliv li{margin-bottom:11px;padding-left:4px}

/* 功能 */
.func{margin-top:20px;border-top:1px solid var(--line)}
.func div{padding:16px 0;border-bottom:1px solid var(--line)}
.func .fn{font-size:16.5px;color:var(--ink);font-weight:600;margin-bottom:4px}
.func .fs{font-size:15px;color:var(--body);line-height:1.75}

/* 流程 */
.flow{margin-top:26px;counter-reset:f}
.flow>div{display:flex;gap:17px;padding:16px 0;border-bottom:1px solid var(--line)}
.flow>div:last-child{border-bottom:none}
.flow .num{counter-increment:f;font-size:13px;font-weight:700;color:var(--hot);
  min-width:24px;padding-top:4px}
.flow .num::before{content:counter(f)}
.flow .t{font-size:16.5px;color:var(--ink);font-weight:600;line-height:1.6}
.flow .t em{display:block;font-style:normal;font-size:15px;color:var(--body);
  font-weight:400;margin-top:5px;line-height:1.75}

/* 风险 */
.risk{margin-top:24px}
.risk>div{padding:20px 0;border-bottom:1px solid var(--line)}
.risk>div:last-child{border-bottom:none}
.risk .rl{font-size:11.5px;letter-spacing:.14em;color:var(--hot);font-weight:700;margin-bottom:6px}
.risk .rt{font-size:17px;color:var(--ink);margin-bottom:6px}
.risk .rd{font-size:15px;color:var(--body);line-height:1.78}

.warn{background:var(--soft);border-left:3px solid var(--hot);padding:17px 21px;
  font-size:15px;line-height:1.8;margin-top:24px;color:var(--body)}
.warn b{color:var(--hot)}

.end{margin-top:74px;padding-top:28px;border-top:2px solid var(--ink);
  font-size:21px;line-height:1.6;color:var(--ink);font-weight:600;text-wrap:balance}
footer{margin-top:64px;font-size:13px;color:var(--dim);line-height:1.9}

@media(max-width:640px){
  body{font-size:16.5px}
  .wrap{padding:50px 22px 90px}
  h1{font-size:28px}
  h2{font-size:22px}
  section{margin-bottom:54px}
  .line{margin-bottom:54px}
  .hero{font-size:18px;padding:21px}
  .end{font-size:19px}
  ol.legend{grid-template-columns:1fr;gap:0}
  #lock .row{flex-direction:column}
}
@media print{
  #lock{display:none!important}
  #doc{display:block!important}
  body{background:#fff;font-size:12pt}
  .wrap{max-width:100%;padding:0}
  .hero,.warn{background:#f7f4f1}
  section{page-break-inside:auto}
  h2,h3{page-break-after:avoid}
}
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(){
  const pw = document.getElementById('pw').value;
  const msg = document.getElementById('msg');
  const btn = document.getElementById('go');
  if(!pw){ msg.className='msg'; msg.textContent='请输入密码'; return; }
  btn.disabled = true; msg.className='msg busy'; msg.textContent='正在解密…';
  try{
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
      'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(SALT), iterations:ITER, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV)}, key, b64(PAYLOAD));
    document.getElementById('content').innerHTML = new TextDecoder().decode(plain);
    document.getElementById('lock').style.display = 'none';
    document.getElementById('doc').style.display = 'block';
    document.title = 'AI 智能消防头盔 · 产品技术文档';
    window.scrollTo(0,0);
  }catch(e){
    msg.className='msg'; msg.textContent='密码不正确，请重试';
    btn.disabled = false;
    document.getElementById('pw').select();
  }
}
document.getElementById('go').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') unlock(); });
document.getElementById('pw').focus();
</script>
