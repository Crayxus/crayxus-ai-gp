<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>简历快筛</title>
<style>
:root{--bg:#F6F5F2;--card:#fff;--ink:#1D1C1A;--mute:#6E6A63;--faint:#A29D94;--line:#E5E1D9;--soft:#F1EEE8;--acc:#2F5D50;--acc2:#E4EEE9;
  --A:#2E7D4F;--Ab:#E3F2E8;--B:#B07A12;--Bb:#FBF0D9;--C:#7A766F;--Cb:#EEECE8;--X:#B4402F;--Xb:#F8E3DF;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--card:#1A1B1E;--ink:#ECEBE7;--mute:#A09C94;--faint:#6F6B65;--line:#2C2D31;--soft:#222327;--acc:#7CC2A8;--acc2:#1E2D28;
  --A:#6FCB93;--Ab:#1B2E22;--B:#E3B04F;--Bb:#2F2715;--C:#A39F98;--Cb:#26272A;--X:#EE7D69;--Xb:#33201C;--shadow:none}}
:root[data-theme="dark"]{--bg:#111214;--card:#1A1B1E;--ink:#ECEBE7;--mute:#A09C94;--faint:#6F6B65;--line:#2C2D31;--soft:#222327;--acc:#7CC2A8;--acc2:#1E2D28;
  --A:#6FCB93;--Ab:#1B2E22;--B:#E3B04F;--Bb:#2F2715;--C:#A39F98;--Cb:#26272A;--X:#EE7D69;--Xb:#33201C;--shadow:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:18px 14px;background:var(--card)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin:0 4px 18px}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--acc);display:grid;place-items:center;color:var(--card);font-style:normal;font-size:15px}
.cap{font-size:12px;color:var(--faint);margin:14px 6px 6px;letter-spacing:.06em}
.job{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:9px 10px;margin-bottom:4px}
.job:hover{background:var(--soft)}
.job.on{background:var(--acc2);border-color:var(--acc)}
.job b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job span{font-size:12px;color:var(--mute)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 12px;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--card);font-weight:600}
.btn.ghost{border-style:dashed;width:100%;color:var(--mute)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.sys{margin-top:22px;font-size:12px;color:var(--mute);padding:10px;border-radius:10px;background:var(--soft);line-height:1.7}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--A);margin-right:6px;vertical-align:1px}
.dot.off{background:var(--X)}
main{padding:20px 26px 60px;min-width:0}
.top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0}
.top .fd{font-size:12.5px;color:var(--mute);margin-top:2px;word-break:break-all}
.top .fd a{color:var(--acc);cursor:pointer}
.acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--mute);cursor:pointer;user-select:none}
.sw i{width:32px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:.15s}
.sw i:after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--card);transition:.15s}
.sw.on i{background:var(--acc)}.sw.on i:after{left:16px}
.drop{margin:16px 0;border:1.5px dashed var(--line);border-radius:12px;padding:12px 16px;color:var(--mute);display:flex;align-items:center;gap:12px;background:var(--card);transition:.15s}
.drop.over{border-color:var(--acc);background:var(--acc2);color:var(--ink)}
.drop b{color:var(--ink);font-weight:600}
.drop .prog{margin-left:auto;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);text-align:left;cursor:pointer}
.st.on{outline:2px solid var(--acc);outline-offset:-1px}
.st em{font-style:normal;font-size:12px;color:var(--mute)}
.st b{display:block;font-size:24px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.st.A b{color:var(--A)}.st.B b{color:var(--B)}.st.X b{color:var(--X)}
.charts{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:10px;margin-top:10px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.panel h3{margin:0 0 8px;font-size:13px;color:var(--mute);font-weight:500}
.hist{display:flex;align-items:flex-end;gap:5px;height:150px}
.hist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--faint)}
.hist s{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--C);min-height:2px;text-decoration:none}
.hist s.A{background:var(--A)}.hist s.B{background:var(--B)}
.hist u{text-decoration:none;font-size:11px;color:var(--mute);height:15px}
.bars .r{display:grid;grid-template-columns:minmax(0,1fr) 110px 34px;gap:8px;align-items:center;font-size:12.5px;margin:4px 0}
.bars .r span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .t{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;display:flex}
.bars .t i{display:block;height:100%}
.bars .r em{font-style:normal;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--ink)}
.chip em{font-style:normal;color:var(--mute);margin-left:3px}
.tools{display:flex;gap:8px;align-items:center;margin:18px 0 8px;flex-wrap:wrap}
.tools input{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 10px;width:220px}
.tools select{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 8px}
.tools .n{color:var(--mute);font-size:13px;margin-left:auto}
.tb{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.tb th{font-size:12px;color:var(--mute);font-weight:500;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--soft);white-space:nowrap}
.tb td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb tr.r{cursor:pointer}.tb tr.r:hover td{background:var(--soft)}
.tb tr.sel td{background:var(--acc2)}
.tb tr.dup td{opacity:.55}
.rk{color:var(--faint);font-variant-numeric:tabular-nums;width:36px}
.nm b{font-weight:600}.nm small{display:block;color:var(--faint);font-size:11.5px;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc{display:flex;align-items:center;gap:8px;min-width:120px}
.sc b{font-size:17px;font-variant-numeric:tabular-nums;width:28px}
.sc .t{flex:1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.sc .t i{display:block;height:100%;border-radius:3px}
.tg{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;white-space:nowrap;font-weight:600}
.tg.A{color:var(--A);background:var(--Ab)}.tg.B{color:var(--B);background:var(--Bb)}.tg.C{color:var(--C);background:var(--Cb)}.tg.X{color:var(--X);background:var(--Xb)}
.tg.q{color:var(--mute);background:var(--soft);font-weight:400}.tg.e{color:var(--X);background:var(--Xb);font-weight:400}
.mu{white-space:nowrap;font-size:12.5px;font-variant-numeric:tabular-nums}
.mu .y{color:var(--A)}.mu .n{color:var(--X)}.mu .u{color:var(--B)}
.sm1{color:var(--mute);font-size:12.5px;max-width:340px}
.sm1 div{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mk{font-size:12px;padding:1px 8px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
.mk.面试{color:var(--A);border-color:var(--A)}.mk.淘汰{color:var(--faint);text-decoration:line-through}.mk.待定{color:var(--B);border-color:var(--B)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--faint);border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-1px;margin-right:5px}
@keyframes sp{to{transform:rotate(360deg)}}
/* 详情抽屉 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:20;display:none}
.mask.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--card);border-left:1px solid var(--line);z-index:21;transform:translateX(100%);transition:transform .18s;overflow-y:auto;padding:22px 24px 40px}
.drawer.on{transform:none}
.dh{display:flex;gap:12px;align-items:flex-start}
.dh h2{margin:0;font-size:21px}
.dh .x{margin-left:auto;border:0;background:none;font-size:22px;color:var(--mute);line-height:1}
.big{display:flex;align-items:center;gap:14px;margin:14px 0 6px}
.big b{font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.big .sub{color:var(--mute);font-size:13px}
.sec{margin-top:18px}
.sec h4{margin:0 0 8px;font-size:13px;color:var(--mute);font-weight:500}
.kv{display:grid;grid-template-columns:76px 1fr;gap:4px 10px;font-size:13.5px}
.kv span{color:var(--mute)}
.dim{margin:7px 0}
.dim .l{display:flex;justify-content:space-between;font-size:13px}
.dim .l em{font-style:normal;color:var(--faint);font-size:12px}
.dim .t{height:7px;border-radius:4px;background:var(--soft);margin:4px 0 2px;overflow:hidden}
.dim .t i{display:block;height:100%;background:var(--acc);border-radius:4px}
.dim p{margin:0;color:var(--mute);font-size:12.5px}
.ck{display:flex;gap:8px;font-size:13px;margin:5px 0}
.ck i{font-style:normal;width:18px;flex:none;text-align:center;font-weight:700}
.ck .y{color:var(--A)}.ck .n{color:var(--X)}.ck .u{color:var(--B)}
.ck small{display:block;color:var(--mute);font-size:12px}
ul.li{margin:0;padding-left:18px;font-size:13.5px}ul.li li{margin:3px 0}
.tl{font-size:13px}.tl div{display:grid;grid-template-columns:120px 1fr;gap:8px;padding:3px 0}.tl em{font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums}
.marks{display:flex;gap:6px}
.marks button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px}
.marks button.on{border-color:var(--acc);background:var(--acc2);font-weight:600}
textarea.note{width:100%;min-height:60px;border:1px solid var(--line);border-radius:9px;background:var(--bg);padding:8px;margin-top:8px;resize:vertical}
.dfoot{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.ct{background:var(--soft);border-radius:12px;padding:12px}
.ct .row{flex-wrap:wrap}
.ct textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:9px;margin:8px 0;resize:vertical;line-height:1.65}
.ct input{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:6px 9px;margin-top:8px}
.ct .who{font-size:13px;color:var(--mute);margin-bottom:8px}.ct .who a{color:var(--acc)}
.ctd{font-size:12px;color:var(--A)}
.err{color:var(--X);font-size:13px;background:var(--Xb);padding:8px 10px;border-radius:9px}
/* 岗位编辑 */
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:flex-start;justify-content:center;background:rgba(0,0,0,.3);padding:40px 16px;overflow-y:auto}
.modal.on{display:flex}
.box{background:var(--card);border-radius:14px;width:min(760px,100%);padding:22px 24px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.box h2{margin:0 0 14px;font-size:19px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:4px}
.f input,.f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 10px}
.f textarea{min-height:64px;resize:vertical}
.f .hint{font-size:12px;color:var(--faint);margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dims .dr{display:grid;grid-template-columns:130px 70px 1fr 28px;gap:6px;margin-bottom:6px}
.dims input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;width:100%}
.dims .dr button{border:0;background:none;color:var(--faint);font-size:18px}
.dims .sum{font-size:12px;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center}
.bfoot{display:flex;gap:8px;margin-top:16px;align-items:center}
.bfoot .del{margin-right:auto;color:var(--X);border-color:transparent;background:none}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13.5px;z-index:40;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.charts{grid-template-columns:1fr}}
@media (max-width:760px){
  .top .acts{margin-left:0}.drop{flex-wrap:wrap}.tools input{width:100%}
  .app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}
  #jobs{display:flex;gap:6px;overflow-x:auto}.job{min-width:150px}.sys,.cap{display:none}
  main{padding:14px 16px 50px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tb th:nth-child(5),.tb td:nth-child(5),.tb th:nth-child(6),.tb td:nth-child(6),.tb th:nth-child(8),.tb td:nth-child(8){display:none}
  .two{grid-template-columns:1fr}.dims .dr{grid-template-columns:1fr 60px 28px}.dims .dr input.ds{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><i>筛</i>简历快筛</div>
    <div class="cap">岗位</div>
    <div id="jobs"></div>
    <button class="btn ghost" id="newJob">＋ 新建岗位</button>
    <div class="sys" id="sys"></div>
  </aside>
  <main id="main"><div class="empty">加载中…</div></main>
</div>
<div class="mask" id="mask"></div>
<div class="drawer" id="drawer"></div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="pick" multiple accept=".pdf,.docx,.txt,.md,.html,.htm,.jpg,.jpeg,.png,.webp,.bmp" hidden>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const api = async (p, body) => {
  const r = await fetch(p, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-RS': '1' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: '服务没响应' }));
  if (j && j.error) throw new Error(j.error);
  return j;
};
let toastT;
const toast = (t) => { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); };

const TIER = { A: 'A 推荐面试', B: 'B 可考虑', C: 'C 不合适', X: '硬性不符' };
const S = { jobs: [], cur: +(localStorage.getItem('rs.job') || 0), rows: [], filter: 'all', q: '', sort: 'score', sel: 0, status: {}, up: { n: 0, done: 0 } };
const job = () => S.jobs.find((j) => j.id === S.cur);
const color = (t) => `var(--${t === 'A' || t === 'B' || t === 'X' ? t : 'C'})`;
const tierOf = (sc, j) => (sc >= j.a ? 'A' : sc >= j.b ? 'B' : 'C');

async function loadJobs() {
  S.jobs = await api('/api/jobs');
  if (!job()) S.cur = S.jobs[0]?.id || 0;
  renderJobs();
}
async function loadRows() {
  if (!S.cur) { S.rows = []; return; }
  S.rows = await api('/api/resumes?job=' + S.cur);
}
async function refresh() {
  try {
    S.status = await api('/api/status');
    try { S.boss = await api('/api/boss/status'); } catch (e) {}
    if (S.waitVer && S.status.version === S.waitVer) return location.reload();  // 升级重启好了，刷新拿新网页
    await loadJobs(); await loadRows();
    renderSys(); renderMain();
    if (S.sel) renderDrawer(false);
  } catch (e) { $('#sys').innerHTML = '<span class="dot off"></span>连不上本机服务：先双击「开始简历快筛」'; }
}
function bossBar() {   // BOSS 初筛进度（10-21）
  const b = S.boss || {}; if (!b.running && !b.error && !b.done) return '';
  const c = b.error ? 'var(--X)' : 'var(--acc)';
  const t = b.running ? `<span class="spin"></span>BOSS 初筛进行中` : b.error ? 'BOSS 初筛停了' : 'BOSS 初筛这一轮结束';
  return `<div style="margin:0 0 12px;padding:10px 14px;border:1px solid ${c};border-radius:10px;background:var(--card);font-size:13px">
    <button class="btn" style="float:right;padding:3px 10px" onclick="window.open('/mini?job=${S.cur}','rsmini','width=420,height=760')">AI·伯乐</button>
    <b style="color:${c}">${t}</b>　读了 <b>${b.done || 0}</b> 人 · 认出读过的跳过 ${b.dup || 0} · 期望不在本地（只看摘要、没翻简历）${b.skipped_city || 0}
    <div style="color:${b.error ? 'var(--X)' : 'var(--mute)'};margin-top:3px">${esc(b.error || b.msg || '')}</div>
    ${b.running ? '<div style="color:var(--faint);margin-top:3px">只看不发：不会给任何人发消息。程序在后台点，不占鼠标；按 F12 或点「停止 BOSS 初筛」随时停，下次接着读。</div>' : ''}</div>`;
}
function renderSys() {
  const s = S.status;
  $('#sys').innerHTML = `<div><span class="dot ${s.key ? '' : 'off'}"></span>${s.key ? '火山方舟已连接' : '没有火山方舟 Key'} <a href="#" id="setkey" style="color:var(--acc)">${s.key ? '换 Key' : '填 Key'}</a></div>
    <div>模型：${esc(s.model || '')}</div>
    ${s.usage ? `<div title="从 ${esc(s.usage.since)} 开始记；准确账单以火山方舟控制台为准">token：今天 ${tk(s.usage.today)}（${s.usage.today.n} 次调用）· 累计 ${tk(s.usage.all)}</div>` : ''}
    <div>版本 v${esc(s.version || '')}${s.upd ? ` · <a href="#" id="doupd" style="color:var(--acc);font-weight:600">升级到 v${esc(s.upd.ver)}</a>${s.upd.note ? `<div style="color:var(--faint)">${esc(s.upd.note)}</div>` : ''}` : (s.frozen ? ` · <a href="#" id="chkupd" style="color:var(--faint)">检查更新</a>` : '')}</div><div>${s.busy ? `<span class="spin"></span>正在读 ${s.busy} 份` : '没有待读的简历'}</div>
    <div style="margin-top:6px;color:var(--faint)">简历和结果只存在这台电脑；只有简历内容会发给火山方舟分析。</div>`;
}
function tk(u) { const n = (u.in || 0) + (u.out || 0); return (n >= 1e4 ? (n / 1e4).toFixed(1) + ' 万' : n) + `<span style="color:var(--faint)">（入 ${((u.in || 0) / 1e4).toFixed(1)} 万 / 出 ${((u.out || 0) / 1e4).toFixed(1)} 万）</span>`; }
function renderJobs() {
  $('#jobs').innerHTML = S.jobs.map((j) => `<button class="job ${j.id === S.cur ? 'on' : ''}" data-job="${j.id}"><b>${esc(j.name)}</b>

/* ---------- 统计 ---------- */
function stats(rows, j) {
  const done = rows.filter((r) => r.status === 'done' && !r.dup_of);
  const st = { done: done.length, busy: rows.filter((r) => r.status === 'queued' || r.status === 'reading').length, err: rows.filter((r) => r.status === 'error').length,
    dup: rows.filter((r) => r.status === 'done' && r.dup_of).length, A: 0, B: 0, C: 0, X: 0, avg: 0, hist: Array(10).fill(0), deg: {}, years: {}, skills: {}, must: (j.must || []).map((m) => ({ m, y: 0, n: 0, u: 0 })) };
  for (const r of done) {
    st[r.tier] = (st[r.tier] || 0) + 1; st.avg += r.total || 0;
    st.hist[Math.min(9, Math.floor((r.total || 0) / 10))]++;
    const d = r.data || {};
    const dg = d.degree || '未知'; st.deg[dg] = (st.deg[dg] || 0) + 1;
    const y = +d.years; const yb = !isFinite(y) ? '未知' : y < 1 ? '1 年内' : y < 3 ? '1–3 年' : y < 5 ? '3–5 年' : y < 10 ? '5–10 年' : '10 年+';
    st.years[yb] = (st.years[yb] || 0) + 1;
    for (const s of new Set((d.skills || []).map((x) => String(x).trim()).filter(Boolean))) st.skills[s] = (st.skills[s] || 0) + 1;
    (d.must || []).forEach((m, i) => { const o = st.must[i]; if (o) o[m.met === '是' ? 'y' : m.met === '否' ? 'n' : 'u']++; });
  }
  st.avg = done.length ? Math.round(st.avg / done.length) : 0;
  return st;
}
const order = (o, keys) => Object.entries(o).sort((a, b) => (keys ? keys.indexOf(a[0]) - keys.indexOf(b[0]) : b[1] - a[1]));

function visible() {
  const j = job(), q = S.q.trim().toLowerCase();
  let rs = S.rows.filter((r) => {
    if (S.filter === 'busy') return r.status !== 'done';
    if (S.filter !== 'all' && (r.status !== 'done' || r.tier !== S.filter || r.dup_of)) return false;
    if (S.mf) { if (S.mf === 'none' ? r.mark : r.mark !== S.mf) return false; }
    if (q) { const d = r.data || {}; const hay = [r.name, r.fname, d.school, d.major, d.current?.company, d.current?.title, d.city, ...(d.skills || []), ...(d.jobs || []).map((x) => x.company)].join(' ').toLowerCase(); if (!hay.includes(q)) return false; }
    return true;
  });
  const T = { A: 0, B: 1, C: 2, X: 3 };
  const key = (r) => r.status !== 'done' ? [9, 0] : [(r.dup_of ? 5 : 0) + (S.sort === 'tier' ? T[r.tier] ?? 4 : 0), -(r.total || 0)];
  if (S.sort === 'new') rs.sort((a, b) => b.id - a.id);
  else rs.sort((a, b) => { const x = key(a), y = key(b); return x[0] - y[0] || x[1] - y[1] || a.id - b.id; });
  return rs;
}

  const drawDims = () => {
    $('#eDims').innerHTML = dims.map((d, i) => `<div class="dr"><input data-i="${i}" data-k="name" value="${esc(d.name)}" placeholder="维度名"><input data-i="${i}" data-k="w" type="number" min="0" max="100" value="${d.w}" title="权重"><input class="ds" data-i="${i}" data-k="desc" value="${esc(d.desc || '')}" placeholder="怎么判断（给模型看的说明）"><button data-rm="${i}" title="删掉">×</button></div>`).join('');
    $('#eSum').textContent = `权重合计 ${dims.reduce((s, d) => s + (+d.w || 0), 0)}（不一定要凑 100，会按比例换算）`;
  };
  drawDims();
  $('#eDims').oninput = (e) => { const t = e.target; if (t.dataset.i) { dims[t.dataset.i][t.dataset.k] = t.dataset.k === 'w' ? +t.value : t.value; if (t.dataset.k === 'w') $('#eSum').textContent = `权重合计 ${dims.reduce((s, d) => s + (+d.w || 0), 0)}（不一定要凑 100，会按比例换算）`; } };
  $('#eDims').onclick = (e) => { const i = e.target.dataset.rm; if (i !== undefined) { dims.splice(+i, 1); drawDims(); } };
  $('#eAddDim').onclick = () => { if (dims.length < 8) { dims.push({ key: '', name: '', w: 10, desc: '' }); drawDims(); } };
  $('#ePick').onclick = async () => { toast('在弹出的窗口里选文件夹…'); const r = await api('/api/pick-folder', {}).catch(() => ({})); if (r.path) $('#eFolder').value = r.path; };
  $('#eCancel').onclick = () => $('#modal').classList.remove('on');
  if (!n) $('#eDel').onclick = async () => { if (!confirm(`删除岗位「${j.name}」和它的全部评分记录？文件夹里的简历原件不会删。`)) return; await api('/api/job/del', { id: j.id }); $('#modal').classList.remove('on'); S.cur = 0; refresh(); };
  $('#eSave').onclick = async () => {
    const body = { id: j.id, name: $('#eName').value, jd: $('#eJd').value, must: $('#eMust').value, plus: $('#ePlus').value, dims, folder: $('#eFolder').value, a: +$('#eA').value, b: +$('#eB').value, auto: j.auto, sign: $('#eSign').value, city: $('#eCity').value };
    try {
      const r = await api('/api/job', body); $('#modal').classList.remove('on');
      S.cur = r.id; localStorage.setItem('rs.job', r.id); await refresh();
      if (!n && S.rows.some((x) => x.status === 'done') && confirm('评分标准改了。要用新标准把这个岗位已读的简历全部重新打分吗？')) { await api('/api/rescore', { job: r.id }); refresh(); }
      else toast('已保存');
    } catch (e) { toast(e.message); }
  };
  $('#modal').classList.add('on');
}
const DEF_DIMS = [
  { key: 'skill', name: '岗位技能匹配', w: 35, desc: '简历里的技能、工具、技术栈和岗位要求的重合程度' },
  { key: 'exp', name: '相关工作经验', w: 25, desc: '做过的工作和这个岗位有多相关、做了多久、承担什么角色' },
  { key: 'proj', name: '项目与成果', w: 20, desc: '有没有能说明能力的具体项目、量化成果、作品、专利、获奖' },
  { key: 'edu', name: '学历与专业', w: 10, desc: '学历层次和专业与岗位的相关程度' },
  { key: 'stable', name: '稳定性与成长', w: 10, desc: '每段任职是否够长、职责是否逐步提升；频繁短期跳槽扣分' },
];

/* ---------- 上传 ---------- */
async function upload(files) {
  const j = job(); if (!j) return;
  files = [...files]; if (!files.length) return;
  S.up = { n: files.length, done: 0 }; let dup = 0, bad = 0;
  for (const f of files) {
    try { const r = await fetch(`/api/upload?job=${j.id}&name=${encodeURIComponent(f.name)}`, { method: 'POST', headers: { 'X-RS': '1' }, body: f }).then((x) => x.json()); if (r.error) bad++; else if (r.dup) dup++; } catch (e) { bad++; }
    S.up.done++; const p = $('#prog'); if (p) p.innerHTML = `<span class="spin"></span>上传 ${S.up.done}/${S.up.n}`;
  }
  toast(`收到 ${files.length - dup - bad} 份，开始读${dup ? `；${dup} 份是重复文件` : ''}${bad ? `；${bad} 份格式不支持` : ''}`);
  S.up = { n: 0, done: 0 }; refresh();
}

/* ---------- 事件 ---------- */
document.addEventListener('click', async (e) => {
  if (e.target.id === 'chkupd') { e.preventDefault(); S.status = await api('/api/check-update', {}); renderSys(); if (!S.status.upd) toast('已经是最新版'); return; }
  if (e.target.id === 'doupd') {
    e.preventDefault();
    if (!confirm('升级到 v' + S.status.upd.ver + '？升级要十几秒，正在读的简历会在重启后接着读。')) return;
    toast('正在下载新版…');
    try { await api('/api/update', {}); toast('升级完成，正在重启…'); S.waitVer = S.status.upd.ver; }
    catch (err) { alert('升级失败：' + err.message); }
    return;
  }
  if (e.target.id === 'setkey') {
    e.preventDefault();
    const k = prompt('粘贴火山方舟 API Key（只存在这台电脑的 data/settings.json）');
    if (!k) return;
    toast('正在试连火山方舟…');
    try { const r = await api('/api/key', { key: k }); if (!r.ok) throw new Error(r.error); toast('Key 可用，已保存'); refresh(); }
    catch (err) { alert('这个 Key 连不上：' + err.message); }
    return;
  }
  const c = e.target.closest('[data-draft],[data-send],[data-copy],[data-ct]');
  if (c) return contact(c, e);
  const t = e.target.closest('[data-job],[data-f],[data-act],[data-mark],tr.r'); if (!t) return;
  const j = job();
  if (t.dataset.job) { S.cur = +t.dataset.job; localStorage.setItem('rs.job', S.cur); S.filter = 'all'; closeDrawer(); await loadRows(); renderJobs(); renderMain(); return; }
  if (t.dataset.f) { S.filter = S.filter === t.dataset.f ? 'all' : t.dataset.f; renderMain(); return; }
  if (t.dataset.mark) { const r = S.rows.find((x) => x.id === S.sel); saveMark(r && r.mark === t.dataset.mark ? '' : t.dataset.mark); return; }
  if (t.matches('tr.r')) { S.sel = +t.dataset.id; renderTable(); renderDrawer(true); return; }
  const a = t.dataset.act;
  try {
    if (a === 'close') closeDrawer();
    else if (a === 'folder') await api('/api/open-folder', { job: j.id });
    else if (a === 'auto') { await api('/api/job/auto', { id: j.id, on: !j.auto }); j.auto = j.auto ? 0 : 1; renderMain(); toast(j.auto ? '自动翻阅已打开：每 15 秒看一次文件夹' : '自动翻阅已关闭'); }
    else if (a === 'boss') {
      if (S.boss && S.boss.running) { await api('/api/boss/stop', {}); toast('正在停…'); refresh(); return; }
      if (!confirm('开始 BOSS 初筛？\n\n先确认：BOSS 直聘电脑版已登录，停在「消息」页，左上角选好「' + j.name + '」这个岗位。\n程序会在后台一个个点开候选人、翻在线简历，截下来交给这里打分。只看，不发任何消息。\n期望城市不含「' + (j.city || '本地') + '」的只看摘要、不翻简历。')) return;
      const r = await api('/api/boss/start', { job: j.id }); if (!r.ok) return alert(r.error); toast('开始了：先校准屏幕，再一个个读'); refresh(); }
    else if (a === 'scan') { const r = await api('/api/scan', { job: j.id }); toast(r.added ? `找到 ${r.added} 份新简历，开始读` : '文件夹里没有新简历'); refresh(); }
    else if (a === 'edit') openEditor(j);
    else if (a === 'rescore') { if (confirm(`按现在的评分标准，把「${j.name}」的简历全部重新打分？`)) { const r = await api('/api/rescore', { job: j.id }); toast(`${r.n} 份重新排队`); refresh(); } }
    else if (a === 'export') location.href = '/api/export?job=' + j.id;
    else if (a === 'pick') $('#pick').click();
    else if (a === 're1') { await api('/api/rescore', { ids: [S.sel] }); toast('重新打分中'); refresh(); }
    else if (a === 'rm') { if (confirm('从列表里移除这份简历？（原件留在文件夹里，下次翻阅不会再读，除非文件改过）')) { await api('/api/remove', { id: S.sel }); closeDrawer(); refresh(); } }
  } catch (err) { toast(err.message); }
});
async function contact(c, e) {
  const r = S.rows.find((x) => x.id === S.sel); if (!r) return;
  const done = async (how) => { await api('/api/contacted', { id: r.id, how }); r.contacted = '刚刚 · ' + how; renderDrawer(false); renderTable(); };
  try {
    if (c.dataset.copy) { await navigator.clipboard.writeText(c.dataset.copy); toast('手机号已复制'); return; }
    if (c.dataset.ct) { done(c.dataset.ct); return; }  // tel: 链接照常打开
    if (c.dataset.draft) {
      c.disabled = true; const t0 = c.textContent; c.innerHTML = '<span class="spin"></span>写着…';
      try { DR[r.id] = await api('/api/draft', { id: r.id, kind: c.dataset.draft }); } finally { c.disabled = false; c.textContent = t0; }
      renderDrawer(false); $('#ctBox').style.display = ''; $('#ctText').focus(); return;
    }
    const sub = $('#ctSub').value, text = $('#ctText').value;
    if (!text.trim()) return toast('先写好消息');
    if (/【[^】]*】/.test(text) && !confirm('消息里还有【】没填，确定就这样发？')) return;
    if (c.dataset.send === 'copy') { await navigator.clipboard.writeText(text); toast('已复制，去微信 / 短信粘贴发送'); done('微信/短信'); }
    else { location.href = `mailto:${encodeURIComponent(r.email)}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(text)}`; done('邮件'); }
  } catch (err) { toast(err.message); }
}
$('#mask').onclick = closeDrawer;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('#modal').classList.remove('on'); closeDrawer(); } });
$('#newJob').onclick = () => openEditor(null);
$('#pick').onchange = (e) => { upload(e.target.files); e.target.value = ''; };
document.addEventListener('input', (e) => { if (e.target.id === 'q') { S.q = e.target.value; renderTable(); } });
document.addEventListener('change', (e) => { if (e.target.id === 'sort') { S.sort = e.target.value; renderTable(); } if (e.target.id === 'mf') { S.mf = e.target.value; renderTable(); } });
let noteT; document.addEventListener('input', (e) => { if (e.target.id === 'note') { clearTimeout(noteT); noteT = setTimeout(() => saveMark(), 700); } });
['dragenter', 'dragover'].forEach((ev) => document.addEventListener(ev, (e) => { e.preventDefault(); $('#drop')?.classList.add('over'); }));
['dragleave', 'drop'].forEach((ev) => document.addEventListener(ev, (e) => { e.preventDefault(); if (ev === 'drop' || !e.relatedTarget) $('#drop')?.classList.remove('over'); }));
document.addEventListener('drop', (e) => upload(e.dataTransfer.files));

refresh();
setInterval(() => { if (!$('#modal').classList.contains('on') && document.activeElement?.id !== 'q') refresh(); }, 3000);
</script>
