<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="择大 ZEDA — 择智能大师 Master the Intelligent Choice">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FC9FF"/>
      <stop offset="1" stop-color="#1E63FF"/>
    </linearGradient>
  </defs>

  <!-- MARK · 智能赛道砖 + 正确之选(对勾/加速箭头) -->
  <g transform="translate(40,50)">
    <rect x="0" y="0" width="160" height="160" rx="34" fill="#0B1220"/>
    <rect x="8" y="8" width="144" height="144" rx="27" fill="none" stroke="url(#blue)" stroke-width="2.5" opacity="0.55"/>
    <!-- check / forward chevron = 择(选择)+ 加速 -->
    <path d="M40 94 L72 126 L138 42" fill="none" stroke="url(#blue)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- AI 节点 -->
    <circle cx="138" cy="42" r="11" fill="#FF7A18"/>
  </g>

  <!-- 分隔 -->
  <rect x="232" y="64" width="2.5" height="132" rx="1.25" fill="#0B1220" opacity="0.12"/>

  <!-- WORDMARK -->
  <text x="262" y="150" font-family="'Microsoft YaHei','PingFang SC','Source Han Sans SC',sans-serif" font-size="98" font-weight="800" fill="#0B1220" letter-spacing="4">择大</text>
  <text x="266" y="190" font-family="'Arial','Helvetica',sans-serif" font-size="26" font-weight="700" fill="#1E63FF" letter-spacing="11">ZEDA</text>

  <!-- TAGLINE -->
  <text x="266" y="226" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="22" font-weight="500" fill="#5A6573">择智能大师 · Master the Intelligent Choice</text>
</svg>
