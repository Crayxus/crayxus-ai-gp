      var hs = hedges(m);
      var best = hs.length ? hs[0] : null;
      var isArb = best && best.payout>1;
      if(isArb){ oppCount++; bestPct=Math.max(bestPct,best.profitPct); totalProfit += B*(best.payout-1); }
      var Hf = m.jc.hcp.line;

      var card = document.createElement('div');
      card.className = 'card'+(isArb?' arb':'');

      // 竞彩 6 SP
      var jcTbl =
        '<table class="ot">'
        + '<tr><td class="rl">不让球</td><td>'+inpL(i,'jc.spf.w','主胜')+'</td><td>'+inpL(i,'jc.spf.d','平')+'</td><td>'+inpL(i,'jc.spf.l','客胜')+'</td></tr>'
        + '<tr><td class="rl">让球 主'+sgl(Hf)+'</td><td>'+inpL(i,'jc.hcp.w','让胜')+'</td><td>'+inpL(i,'jc.hcp.d','让平')+'</td><td>'+inpL(i,'jc.hcp.l','让负')+'</td></tr>'
        + '</table>';

      // bet365 亚盘梯子（逐线竖排，每行 主/客 两侧）
      var ahTbl = '<table class="ot">'+ m.b3.ah.map(function(a,ai){
        return '<tr><td class="rl">盘口 '+Math.abs(a.line)+'</td>'
             + '<td>'+inpL(i,'b3.ah.'+ai+'.home','主'+sgl(a.line))+'</td>'
             + '<td>'+inpL(i,'b3.ah.'+ai+'.away','客'+sgl(-a.line))+'</td></tr>';
      }).join('') + '</table>';

      // 对冲组合：所有套利 + 至多补到 3 条（不足用最接近的无套利参考）
      var arbs = hs.filter(function(h){return h.payout>1;});
      var show = arbs.slice(0,4);
      if(show.length < 3) show = show.concat(hs.filter(function(h){return h.payout<=1;}).slice(0, 3-show.length));
      var hgHtml = show.map(function(h){
        var arb = h.payout>1;
        var ret = B*h.payout, prof = ret-B;
        var legHtml = h.legs.map(function(g){
          var stake = B*(1/g.odds)/h.inv;
          return '<div class="leg"><i class="chip '+g.book+'">'+(g.book==='jc'?'竞彩':'365')+'</i>'
               + g.label.replace('竞彩 ','').replace('bet365 ','')+' @'+(+g.odds).toFixed(2)
               + '<span class="stk">投<b>¥'+fmt(stake)+'</b></span></div>';
        }).join('');
        return '<div class="hg'+(arb?' arb':'')+'">'
          + '<div class="hg-top"><span class="hg-ret'+(arb?' arb':'')+'">返还 '+(h.payout*100).toFixed(2)+'%</span>'
          + '<span class="hg-prof '+(arb?'arb':'neg')+'">'+(prof>=0?'+¥'+fmt(prof):'−¥'+fmt(-prof))+' ('+(h.profitPct>=0?'+':'')+h.profitPct.toFixed(2)+'%)</span></div>'
          + '<div class="hg-legs">'+legHtml+'</div>'
          + '<div class="hg-foot">任意比分保底回收 <b>¥'+fmt(ret)+'</b></div>'
          + '</div>';
      }).join('');

      card.innerHTML =
          '<div class="card-h">'
        +   '<div class="meta"><span>'+m.league+'</span><span>'+m.time+' 北京</span></div>'
        +   '<div class="teams"><span class="t">'+m.home+'</span><span class="vs">VS</span><span class="t">'+m.away+'</span></div>'
        +   '<div class="sub"><span class="hcap">竞彩让球：主队 '+sgl(Hf)+'</span>'
        +     '<span class="badge '+(isArb?'yes':'no')+'">'+(isArb?'套利 +'+best.profitPct.toFixed(2)+'%':'无套利 '+(best?best.profitPct.toFixed(2)+'%':'—'))+'</span></div>'
        + '</div>'
        + '<div class="mkt"><div class="mkt-h"><span class="bk jc">竞彩</span><span>胜平负 + 让球（6 个 SP）</span></div>'+jcTbl+'</div>'
        + '<div class="mkt"><div class="mkt-h"><span class="bk b3">bet365</span><span>欧赔 + 亚盘梯子</span></div>'
        +   '<div class="x2">欧赔 <b>主 '+m.b3.x2.h.toFixed(2)+'</b> · <b>平 '+m.b3.x2.d.toFixed(2)+'</b> · <b>客 '+m.b3.x2.a.toFixed(2)+'</b><em>实时</em></div>'
        +   ahTbl+'</div>'
        + '<div class="hedges"><div class="hh"><span>对冲组合</span><span>本金 ¥'+fmt(B)+'/场</span></div>'+hgHtml+'</div>';

      grid.appendChild(card);
    });

    document.getElementById('sumOpp').textContent = oppCount+' / '+MATCHES.length;
    document.getElementById('sumOpp').className = 'val '+(oppCount>0?'green':'gray');
    document.getElementById('sumBest').textContent = oppCount>0?('+'+bestPct.toFixed(2)+'%'):'—';
    document.getElementById('sumBest').className = 'val '+(oppCount>0?'green':'gray');
    document.getElementById('sumProfit').textContent = (totalProfit>=0?'+¥':'−¥')+fmt(Math.abs(totalProfit));
    document.getElementById('sumProfit').className = 'val '+(totalProfit>0?'green':'gray');

    if(fk){
      var sel = grid.querySelector('input[data-i="'+fk.i+'"][data-p="'+fk.p+'"]');
      if(sel){ sel.focus(); if(fk.pos!=null){ try{ sel.setSelectionRange(fk.pos,fk.pos); }catch(e){} } }
    }
    flash = {};
  }
  // 带小标签的输入
  function inpL(i,path,label){
    var html = inp(i,path);
    return html.replace('</div>', '<small>'+label+'</small></div>');
  }

  // 赔率编辑 → 实时重算
  grid.addEventListener('input', function(e){
    var t=e.target; if(t.tagName!=='INPUT'||t.dataset.p===undefined) return;
    var v=parseFloat(t.value); if(isNaN(v)||v<=0) return;
    setp(MATCHES[+t.dataset.i], t.dataset.p, v);
    render();
  });
  bankrollEl.addEventListener('input', render);

  // ===== 每30秒模拟盘口跳动 + 倒计时 =====
  var REFRESH=30, remain=REFRESH, paused=false;
  var cdEl=document.getElementById('countdown'), pbar=document.getElementById('pbar'), pauseBtn=document.getElementById('pauseBtn');
  function nudge(cur,base){ var v=cur+(Math.random()-0.5)*0.024*cur+(base-cur)*0.18; return Math.max(1.02, Math.round(v*100)/100); }
  function oddPaths(m,i){
    var ps=['jc.spf.w','jc.spf.d','jc.spf.l','jc.hcp.w','jc.hcp.d','jc.hcp.l'];
    m.b3.ah.forEach(function(a,ai){ ps.push('b3.ah.'+ai+'.home'); ps.push('b3.ah.'+ai+'.away'); });
    return ps;
  }
  function refreshOdds(){
    var act=document.activeElement;
    if(act&&act.tagName==='INPUT'&&act.dataset.p!==undefined) return false;  // 正在手改则本轮跳过
    flash={};
    MATCHES.forEach(function(m,i){
      oddPaths(m,i).forEach(function(p){
        var old=getp(m,p), nv=nudge(old, getp(BASE[i],p));
        setp(m,p,nv);
        flash[i+'|'+p] = nv>old?1:(nv<old?-1:0);
      });
    });
    return true;
  }
  function paintCD(){ cdEl.textContent=paused?'已暂停':remain+'s'; cdEl.className='val '+(paused?'gray':'green');
    if(pbar) pbar.style.transform='scaleX('+(paused?0:remain/REFRESH)+')'; }
  setInterval(function(){ if(paused) return; remain--;
    if(remain<=0){ remain=REFRESH; if(refreshOdds()) render(); } paintCD(); }, 1000);
  pauseBtn.addEventListener('click', function(){ paused=!paused;
    pauseBtn.textContent=paused?'▶ 继续':'⏸ 暂停'; paintCD(); });

  render(); paintCD();
})();
</script>
</body>
</html>
