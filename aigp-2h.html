<script>
const T = {"walls":[[[-0.05,4.35],[-0.04,4.44],[-0.02,4.52],[0.03,4.6],[0.08,4.67],[0.15,4.72],[0.23,4.77],[0.31,4.79],[0.4,4.8],[9.12,4.8],[9.21,4.79],[9.29,4.77],[9.37,4.72],[9.44,4.67],[9.49,4.6],[9.54,4.52],[9.56,4.44],[9.57,4.35],[9.57,0.4],[9.56,0.31],[9.54,0.23],[9.49,0.15],[9.44,0.08],[9.37,0.03],[9.29,-0.02],[9.21,-0.04],[9.12,-0.05],[6.67,-0.05],[6.59,-0.04],[6.5,-0.02],[6.42,0.03],[6.36,0.08],[6.3,0.15],[6.26,0.23],[6.23,0.31],[6.22,0.4],[6.22,1.98],[4.22,1.98],[4.22,0.4],[4.22,0.31],[4.19,0.23],[4.15,0.15],[4.09,0.08],[4.03,0.03],[3.95,-0.02],[3.86,-0.04],[3.77,-0.05],[0.4,-0.05],[0.31,-0.04],[0.23,-0.02],[0.15,0.03],[0.08,0.08],[0.03,0.15],[-0.02,0.23],[-0.04,0.31],[-0.05,0.4]],[[1.74,1.81],[2.94,1.81],[2.94,3.01],[1.74,3.01]],[[2.94,2.81],[7.55,2.81],[7.55,1.4],[7.71,1.4],[7.71,2.93],[2.94,2.93]]],"sl":[[3.05,4.62],[3.05,3.02]],"start":[3.55,3.46,3.14],"line":[[3.52,3.53],[3.37,3.53],[3.23,3.58],[3.13,3.69],[3.02,3.8],[2.9,3.88],[2.75,3.9],[2.6,3.91],[2.45,3.91],[2.3,3.91],[2.15,3.91],[2.0,3.91],[1.85,3.91],[1.7,3.88],[1.58,3.8],[1.49,3.69],[1.42,3.55],[1.34,3.42],[1.24,3.32],[1.11,3.23],[0.99,3.15],[0.9,3.03],[0.86,2.89],[0.85,2.74],[0.85,2.59],[0.85,2.44],[0.85,2.29],[0.85,2.13],[0.85,1.99],[0.88,1.84],[0.94,1.7],[1.04,1.6],[1.16,1.5],[1.22,1.37],[1.26,1.23],[1.35,1.12],[1.46,1.01],[1.6,1.05],[1.71,1.15],[1.85,1.18],[2.0,1.15],[2.15,1.13],[2.3,1.14],[2.44,1.16],[2.59,1.2],[2.72,1.15],[2.81,1.03],[2.93,0.96],[3.05,1.04],[3.13,1.16],[3.23,1.26],[3.35,1.36],[3.43,1.48],[3.52,1.6],[3.54,1.75],[3.58,1.9],[3.6,2.04],[3.66,2.18],[3.78,2.27],[3.92,2.33],[4.06,2.37],[4.21,2.4],[4.36,2.41],[4.51,2.41],[4.66,2.41],[4.81,2.41],[4.96,2.41],[5.11,2.41],[5.26,2.41],[5.41,2.41],[5.56,2.4],[5.71,2.4],[5.86,2.4],[6.01,2.41],[6.16,2.4],[6.31,2.38],[6.45,2.35],[6.59,2.29],[6.71,2.2],[6.82,2.1],[6.86,1.96],[6.86,1.81],[6.91,1.67],[6.91,1.52],[6.91,1.37],[6.96,1.23],[7.01,1.09],[7.07,0.95],[7.16,0.83],[7.29,0.76],[7.43,0.72],[7.58,0.7],[7.72,0.74],[7.85,0.83],[7.96,0.92],[8.08,1.02],[8.22,1.05],[8.37,1.09],[8.49,1.17],[8.49,1.3],[8.39,1.41],[8.38,1.56],[8.43,1.7],[8.47,1.84],[8.5,1.99],[8.5,2.14],[8.49,2.29],[8.45,2.44],[8.41,2.58],[8.37,2.73],[8.45,2.84],[8.54,2.95],[8.49,3.08],[8.38,3.19],[8.29,3.31],[8.18,3.41],[8.04,3.48],[7.92,3.56],[7.8,3.65],[7.7,3.76],[7.57,3.84],[7.42,3.86],[7.27,3.87],[7.12,3.87],[6.97,3.87],[6.82,3.87],[6.67,3.87],[6.52,3.85],[6.42,3.75],[6.33,3.63],[6.21,3.53],[6.07,3.5],[5.92,3.49],[5.77,3.5],[5.62,3.5],[5.47,3.5],[5.32,3.5],[5.17,3.51],[5.02,3.51],[4.87,3.51],[4.72,3.51],[4.57,3.52],[4.42,3.52],[4.27,3.52],[4.12,3.52],[3.97,3.53],[3.82,3.53],[3.67,3.53]]};

/* ══════════ 几何工具 ══════════ */
const SEGS = [];
for (const w of T.walls)
  for (let i = 0; i < w.length; i++) SEGS.push([w[i], w[(i + 1) % w.length]]);
function inside(x, y) {           // even-odd 全多边形
  let c = 0;
  for (const w of T.walls)
    for (let i = 0, n = w.length; i < n; i++) {
      const a = w[i], b = w[(i + 1) % n];
      if ((a[1] > y) !== (b[1] > y) &&
          x < a[0] + (y - a[1]) / (b[1] - a[1]) * (b[0] - a[0])) c++;
    }
  return c % 2 === 1;
}
function distW(x, y) {            // 离墙最近距离
  let m = 9;
  for (const [a, b] of SEGS) {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const L2 = dx * dx + dy * dy || 1e-9;
    let t = ((x - a[0]) * dx + (y - a[1]) * dy) / L2;
    t = Math.max(0, Math.min(1, t));
    m = Math.min(m, Math.hypot(x - a[0] - t * dx, y - a[1] - t * dy));
  }
  return m;
}
function ray(x, y, th) {          // 射线到墙
  const dx = Math.cos(th), dy = Math.sin(th);
  let best = 12;
  for (const [a, b] of SEGS) {
    const ex = b[0] - a[0], ey = b[1] - a[1];
    const den = dx * ey - dy * ex;
    if (Math.abs(den) < 1e-9) continue;
    const t = ((a[0] - x) * ey - (a[1] - y) * ex) / den;
    const u = ((a[0] - x) * dy - (a[1] - y) * dx) / den;
    if (t > 0 && u >= 0 && u <= 1) best = Math.min(best, t);
  }
  return best;
}
/* 逐点速度(与车端 _line_speeds 同规则: cv=0.30, vmax=0.45) */
const LN = T.line, NL = LN.length, SPD = [];
for (let i = 0; i < NL; i++) {
  const a = LN[(i - 2 + NL) % NL], b = LN[i], c = LN[(i + 2) % NL];
  const h1 = Math.atan2(b[1] - a[1], b[0] - a[0]);
  const h2 = Math.atan2(c[1] - b[1], c[0] - b[0]);
  let t = Math.abs((h2 - h1 + Math.PI * 3) % (Math.PI * 2) - Math.PI);
  let v = t > .40 ? .30 : t > .22 ? .375 : .45;
  if (b[0] > 3.3 && b[0] < 7.1 && b[1] > 1.7 && b[1] < 3.0) v = .30;
  SPD.push(v);
}
const vcol = v => v <= .30 ? "var(--v-slow)" : v <= .38 ? "var(--v-mid)" : "var(--v-fast)";

/* ══════════ SVG 画布(等比世界坐标) ══════════ */
const W = 940, H = 520, PAD = 26;
const bx = [-0.25, 9.85], by = [-0.25, 5.05];
const S = Math.min((W - 2 * PAD) / (bx[1] - bx[0]), (H - 2 * PAD) / (by[1] - by[0]));
const mx = x => PAD + (x - bx[0]) * S;
const my = y => H - PAD - (y - by[0]) * S;
const poly = w => w.map((p, i) => (i ? "L" : "M") + mx(p[0]).toFixed(1) + " " + my(p[1]).toFixed(1)).join("") + "Z";
function svgO(extra) {
  return `<svg viewBox="0 0 ${W} ${H}" ${extra || ""}>`;
}
function walls(glow) {
  let s = "";
  for (const w of T.walls)
    s += `<path d="${poly(w)}" fill="none" stroke="${glow ? "var(--acc)" : "#3d5a75"}"
      stroke-width="${glow ? 3 : 2.2}" ${glow ? 'filter="url(#g)"' : ""} stroke-linejoin="round"/>`;
  s += `<line x1="${mx(T.sl[0][0])}" y1="${my(T.sl[0][1])}" x2="${mx(T.sl[1][0])}" y2="${my(T.sl[1][1])}"
        stroke="#e9eef4" stroke-width="3" stroke-dasharray="7 6" opacity=".8"/>`;
  return s;
}
const GLOWDEF = `<defs><filter id="g" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
function raceline(colored, width) {
  let s = "";
  for (let i = 0; i < NL; i++) {
    const a = LN[i], b = LN[(i + 1) % NL];
    s += `<line x1="${mx(a[0]).toFixed(1)}" y1="${my(a[1]).toFixed(1)}" x2="${mx(b[0]).toFixed(1)}" y2="${my(b[1]).toFixed(1)}"
      stroke="${colored ? vcol(SPD[i]) : "rgba(170,220,255,.55)"}" stroke-width="${width || 3}" stroke-linecap="round">
      ${colored ? `<title>目标速度 ${SPD[i].toFixed(2)} m/s</title>` : ""}</line>`;
  }
  return s;
}
function carDot(x, y, r, col) {
  return `<circle cx="${mx(x)}" cy="${my(y)}" r="${r || 7}" fill="${col || "var(--gold)"}" stroke="#171a21" stroke-width="2"/>`;
}

/* ══════════ 各页图形 ══════════ */
function figTrack() {   // 封面/开场底图
  return svgO() + GLOWDEF + walls(true) + raceline(false, 2.5) + carDot(T.start[0], T.start[1]) + "</svg>";
}
function figLidar() {
  const [cx, cy] = [T.start[0], T.start[1]];
  let rays = "";
  for (let a = 0; a < 360; a += 4) {
    const th = a * Math.PI / 180, d = ray(cx, cy, th);
    const ex = cx + d * Math.cos(th), ey = cy + d * Math.sin(th);
    rays += `<line x1="${mx(cx)}" y1="${my(cy)}" x2="${mx(ex).toFixed(1)}" y2="${my(ey).toFixed(1)}"
       stroke="rgba(103,193,245,.28)" stroke-width="1"/>
       <circle cx="${mx(ex).toFixed(1)}" cy="${my(ey).toFixed(1)}" r="2.4" fill="var(--acc)"/>`;
  }
  return svgO() + walls(false) + rays + carDot(cx, cy) + "</svg>";
}
function figDF() {
  const cell = 0.17;
  let cells = "";
  for (let x = 0; x < 9.65; x += cell)
    for (let y = 0; y < 4.85; y += cell) {
      const px = x + cell / 2, py = y + cell / 2;
      if (!inside(px, py)) continue;
      const d = Math.min(distW(px, py), 1.1) / 1.1;   // 0..1
      const c = d < .34 ? "#22405c" : d < .67 ? "#3f7fa8" : "#8ecdf6";
      cells += `<rect x="${mx(x).toFixed(1)}" y="${my(y + cell).toFixed(1)}" width="${(cell * S).toFixed(1)}" height="${(cell * S).toFixed(1)}" fill="${c}" rx="1.5"/>`;
    }
  return svgO() + cells + walls(false) + "</svg>";
}
function figZones() {
  const cell = 0.17;
  let cells = "";
  for (let x = 0; x < 9.65; x += cell)
    for (let y = 0; y < 4.85; y += cell) {
      const px = x + cell / 2, py = y + cell / 2;
      if (!inside(px, py)) continue;
      const d = distW(px, py);
      const c = d < 0.28 ? "rgba(255,111,111,.5)" : "rgba(111,208,140,.32)";
      cells += `<rect x="${mx(x).toFixed(1)}" y="${my(y + cell).toFixed(1)}" width="${(cell * S).toFixed(1)}" height="${(cell * S).toFixed(1)}" fill="${c}" rx="1.5"/>`;
    }
  return svgO() + cells + walls(false) + "</svg>";
}
function figPursuit() {
  const ci = 118;                       // 车所在参考线索引(直道段)
  const [cx, cy] = LN[ci];
  let tgt = null;
  for (let k = 1; k < 25; k++) {
    const p = LN[(ci + k) % NL];
    if (Math.hypot(p[0] - cx, p[1] - cy) >= 0.6) { tgt = p; break; }
  }
  return svgO() + walls(false) + raceline(false, 3)
    + `<circle cx="${mx(cx)}" cy="${my(cy)}" r="${(0.6 * S).toFixed(1)}" fill="none" stroke="rgba(245,182,66,.5)" stroke-dasharray="5 5" stroke-width="1.6"/>`
    + `<line x1="${mx(cx)}" y1="${my(cy)}" x2="${mx(tgt[0])}" y2="${my(tgt[1])}" stroke="var(--gold)" stroke-width="2.6" marker-end="url(#ah)"/>`
    + `<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9z" fill="var(--gold)"/></marker></defs>`
    + carDot(cx, cy, 8) + `<circle cx="${mx(tgt[0])}" cy="${my(tgt[1])}" r="6" fill="none" stroke="var(--gold)" stroke-width="2.4"/>`
    + `<text x="${mx(cx) + 14}" y="${my(cy) - 14}" fill="var(--gold)" font-size="15">前瞻 0.6m 注视点</text>`
    + "</svg>";
}
function figSpeed() {
  return svgO() + walls(false) + raceline(true, 5)
    + `<rect x="${mx(3.88)}" y="${my(2.96)}" width="${(2.8 * S).toFixed(1)}" height="${(0.12 * S).toFixed(1)}" fill="none"/>`
    + `<text x="${mx(5.28)}" y="${my(2.35)}" fill="var(--sub)" font-size="14" text-anchor="middle">窄巷区 · 永远 0.30 铁闸</text>`
    + "</svg>";
}
function figReloc() {
  let dots = "";
  for (let x = 0.4; x < 9.4; x += 0.45)
    for (let y = 0.4; y < 4.6; y += 0.45) {
      if (!inside(x, y) || distW(x, y) < 0.25) continue;
      dots += `<circle cx="${mx(x).toFixed(1)}" cy="${my(y).toFixed(1)}" r="2.6" fill="rgba(103,193,245,.3)"/>`;
    }
  const cands = [[1.5, 1.2, "残差 21cm"], [7.9, 3.9, "残差 14cm"], [3.55, 3.46, "残差 4cm ✓"]];
  let marks = "";

    ["🖨", "结构件", "雷达座 / 立柱\n自建模 3D 打印"],
    ["⚡", "驱动板固件", "ESP32-S3 接管\n电机 + 舵机"],
    ["⏱", "视觉计圈器", "ESP32-CAM\n自制计时盒"],
    ["🛰", "定位算法", "距离场 + 扫描匹配\n绑架自愈"],
    ["🖥", "网页驾驶舱", "实时遥测\n大屏 + 教师面板"],
    ["📱", "微信小程序", "扫码上车\n抽卡 / 成绩榜"],
    ["🧬", "端到端模型", "双光线 CNN\n自采数据训练"],
    ["🏁", "赛道与围栏", "拼版印刷\n场地标定"]];
  let s = "";
  items.forEach((it, i) => {
    const x = 16 + (i % 4) * 232, yy = 46 + Math.floor(i / 4) * 210;
    s += `<rect x="${x}" y="${yy}" width="212" height="176" rx="13" fill="var(--card)" stroke="var(--edge)" stroke-width="1.5"/>
      <text x="${x + 106}" y="${yy + 52}" text-anchor="middle" font-size="30">${it[0]}</text>
      <text x="${x + 106}" y="${yy + 88}" text-anchor="middle" fill="var(--ink)" font-size="17" font-weight="700">${it[1]}</text>`;
    it[2].split("\n").forEach((ln, j) => {
      s += `<text x="${x + 106}" y="${yy + 116 + j * 22}" text-anchor="middle" fill="var(--muted)" font-size="13">${ln}</text>`;
    });
  });
  return svgO() + s + "</svg>";
}

/* ══════════ 渲染 + 导航 ══════════ */
const deckEl = document.getElementById("deck");
DECK.forEach((d, i) => {
  const sec = document.createElement("section");
  if (d.hero) { sec.className = "slide hero"; sec.innerHTML = d.html; }
  else {
    sec.className = "slide";
    const figHtml = typeof d.fig === "function" ? d.fig() : d.fig;
    const isRaw = figHtml.trim().startsWith("<div");
    sec.innerHTML = `
      <div class="txt">
        <div class="kick">${d.kick}</div><h2>${d.title}</h2><div class="bar"></div>
        <ul>${d.bullets.map(b => `<li><b>${b[0]}</b><span>${b[1]}</span></li>`).join("")}</ul>
        ${d.demo ? `<div class="demo"><b>🎬 现场看点</b> · ${d.demo}</div>` : ""}
      </div>
      <div class="fig">${isRaw ? figHtml : `<div class="figbox">${figHtml}</div>`}
        ${d.cap ? `<div class="figcap">${d.cap}</div>` : ""}</div>`;
  }
  deckEl.appendChild(sec);
});
const slides = [...document.querySelectorAll(".slide")];
let cur = Math.min(Math.max((parseInt(location.hash.slice(1)) || 1) - 1, 0), slides.length - 1);
function show(i) {
  cur = Math.min(Math.max(i, 0), slides.length - 1);
  slides.forEach((s, j) => s.classList.toggle("on", j === cur));
  document.getElementById("nav").textContent = (cur + 1) + " / " + slides.length;
  location.hash = cur + 1;
}
addEventListener("keydown", e => {
  if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(cur + 1); }
  if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  if (e.key === "Home") show(0);
  if (e.key === "End") show(slides.length - 1);
});
document.getElementById("aR").onclick = () => show(cur + 1);
document.getElementById("aL").onclick = () => show(cur - 1);
show(cur);
</script>
