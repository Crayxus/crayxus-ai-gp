<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRAYXUS AI · 量化自动交易终端</title>
<meta name="description" content="Crayxus AI 量化自动交易终端 · AI首选信号 · 实时日线 · 止盈止损 · 自动下单 · 每日盈亏">
<meta property="og:title" content="CRAYXUS AI · 量化自动交易终端">
<meta property="og:description" content="AI 首选信号 · 实时日线 · 自动下单 · 每日盈亏">
<meta property="og:image" content="https://crayxus.com.au/og-research.jpg">
<meta property="og:url" content="https://crayxus.com.au/auto.html">
<link rel="icon" href="https://crayxus.com.au/favicon.ico">
<style>
:root{
  --bg:#05080f;--txt:#dbe7ff;--mut:#6f82ad;--cyan:#27e0e6;--vio:#7c5cff;--gold:#f5c451;
  --up:#ff4d57;--down:#19d07a;--line:rgba(96,132,210,.16);--glass:rgba(14,21,38,.66);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--txt);overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
  background-image:
    radial-gradient(1100px 560px at 82% -8%,rgba(39,224,230,.13),transparent 60%),
    radial-gradient(900px 520px at 10% 6%,rgba(124,92,255,.16),transparent 58%),
    radial-gradient(800px 600px at 50% 118%,rgba(245,196,81,.08),transparent 60%),
    linear-gradient(0deg,rgba(96,132,210,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(96,132,210,.045) 1px,transparent 1px);
  background-size:auto,auto,auto,44px 44px,44px 44px;
  animation:drift 60s linear infinite;
}
@keyframes drift{to{background-position:0 0,0 0,0 0,44px 44px,44px 44px}}
.mono{font-variant-numeric:tabular-nums;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
.scan{position:fixed;left:0;right:0;height:2px;pointer-events:none;z-index:9;opacity:.45;
  background:linear-gradient(90deg,transparent,rgba(39,224,230,.6),transparent);animation:scan 7s linear infinite}
@keyframes scan{0%{top:-2px}100%{top:100%}}
.wrap{max-width:1720px;margin:0 auto;padding:14px clamp(10px,2vw,26px)}
/* header */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:12px 18px;border:1px solid var(--line);border-radius:16px;
  background:linear-gradient(180deg,rgba(20,30,54,.82),rgba(8,13,26,.7));backdrop-filter:blur(10px);
  position:relative;overflow:hidden}
.bar::after{content:"";position:absolute;inset:0;border-radius:16px;padding:1px;pointer-events:none;
  background:linear-gradient(120deg,rgba(39,224,230,.5),transparent 30%,transparent 70%,rgba(124,92,255,.5));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:20px;color:var(--cyan);
  background:linear-gradient(135deg,#1b2b4d,#0b1424);border:1px solid rgba(39,224,230,.5);
  box-shadow:0 0 22px rgba(39,224,230,.4);animation:pulseGlow 2.6s ease-in-out infinite}
@keyframes pulseGlow{50%{box-shadow:0 0 32px rgba(39,224,230,.7)}}
.brand b{font-size:17px;letter-spacing:1px}
.brand .sub{font-size:10px;color:var(--mut);letter-spacing:3px;margin-top:1px}
.kpis{display:flex;gap:clamp(12px,2vw,26px);flex-wrap:wrap}
.kpi .k{font-size:10px;color:var(--mut);letter-spacing:1.5px}
.kpi .v{font-size:clamp(18px,2.1vw,25px);font-weight:800;margin-top:2px;text-shadow:0 0 18px rgba(39,224,230,.25)}
.up{color:var(--up)}.down{color:var(--down)}.cy{color:var(--cyan)}.gd{color:var(--gold)}
.live{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--cyan);letter-spacing:1.5px;
  border:1px solid rgba(39,224,230,.3);border-radius:20px;padding:5px 11px;background:rgba(39,224,230,.06)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
/* ticker */
.ticker{margin-top:10px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--glass);height:34px;display:flex;align-items:center}
.ticker .tag{flex:none;font-size:10px;letter-spacing:2px;color:#05080f;background:var(--cyan);padding:9px 12px;font-weight:800}
.tk{white-space:nowrap;animation:tk 28s linear infinite;font-size:12.5px;color:#9fb3d8;padding-left:18px}
.tk b{color:var(--cyan)} .tk .r{color:var(--up)} .tk .g{color:var(--down)}
@keyframes tk{from{transform:translateX(60vw)}to{transform:translateX(-120%)}}
/* deck */
.deck{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:14px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--glass);backdrop-filter:blur(10px);
  padding:14px;position:relative;overflow:hidden;min-width:0}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(39,224,230,.55),transparent)}
.cor{position:absolute;width:14px;height:14px;border:2px solid rgba(39,224,230,.4)}
.cor.tl{top:7px;left:7px;border-right:0;border-bottom:0}.cor.br{bottom:7px;right:7px;border-left:0;border-top:0}
.h{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.h .t{font-size:12px;letter-spacing:2px;color:var(--mut);font-weight:700}
.h .t b{color:var(--cyan)}
.tag2{font-size:10px;padding:2px 9px;border-radius:6px;border:1px solid var(--line);color:var(--mut)}
.c-sig{grid-column:span 3}.c-kline{grid-column:span 6}.c-nav{grid-column:span 3}
.c-trades{grid-column:span 5}.c-hold{grid-column:span 4}.c-lock{grid-column:span 3}
@media(max-width:1180px){.c-sig,.c-nav,.c-hold,.c-lock{grid-column:span 6}.c-kline,.c-trades{grid-column:span 12}}
@media(max-width:680px){.deck>*{grid-column:span 12!important}.bar{padding:11px 13px}.kpis{gap:14px;width:100%}}
/* signal */
.sigName{font-size:19px;font-weight:800}.sigName .c{font-size:11px;color:var(--mut);margin-left:6px}
.sigPx{display:flex;align-items:baseline;gap:9px;margin:3px 0 8px}
.sigPx .p{font-size:26px;font-weight:800}.sigPx .ch{font-size:14px;font-weight:700}
.ringRow{display:flex;align-items:center;gap:6px;justify-content:center}
.pill{font-size:10px;padding:2px 9px;border-radius:6px;margin-left:6px;vertical-align:middle}
.pill.hold{background:rgba(255,77,87,.15);color:var(--up);border:1px solid rgba(255,77,87,.32)}
.pill.watch{background:rgba(39,224,230,.12);color:var(--cyan);border:1px solid rgba(39,224,230,.3)}
.radarWrap{display:flex;align-items:center;justify-content:center;margin-top:4px}
/* kline */
.kl{position:relative}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;margin-top:11px}
.legend span b{font-weight:800;margin-left:3px}
.lvBuy{color:var(--cyan)}.lvTp{color:var(--up)}.lvSl{color:var(--down)}
/* 楼梯加仓计划 */
.ladder:empty{display:none}
.ladder{margin-top:13px;border-top:1px solid var(--line);padding-top:12px}
.lhead{font-size:11px;color:var(--mut);letter-spacing:1px;margin-bottom:10px}
.lhead .g{color:var(--gold);margin-left:8px}
.lsteps{display:flex;gap:8px;flex-wrap:wrap}
.lstep{flex:1;min-width:84px;border:1px solid var(--line);border-radius:11px;padding:9px 6px;background:rgba(20,28,48,.5);text-align:center;line-height:1.5}
.lstep span{display:block;font-size:10px;color:var(--mut)}
.lstep b{display:block;font-size:13px;margin:3px 0;font-weight:800}
.lstep i{font-size:12.5px;color:var(--cyan);font-style:normal}
.lstep.done{border-color:rgba(245,196,81,.5);background:rgba(245,196,81,.1);box-shadow:0 0 12px rgba(245,196,81,.13)}
.lstep.done b{color:var(--gold)}
.lstep.tp{border-color:rgba(255,77,87,.45)}.lstep.tp i{color:var(--up)}
.lstep.stop{border-color:rgba(25,208,122,.45)}.lstep.stop i{color:var(--down)}
/* 排版优化：留白与字号 */
.card{padding:16px 17px}
.h{margin-bottom:13px}
.kpi{min-width:84px}
.kpi .k{margin-bottom:3px}
.sigPx{margin:6px 0 13px}
.sigName{line-height:1.5}
.row{padding:9px 4px}
.hold{padding:10px 4px;line-height:1.55}
.q{padding:13px 12px}
/* nav */
.navwrap{position:relative;height:142px}
.navnow{position:absolute;right:6px;top:2px;text-align:right}
.navnow .big{font-size:19px;font-weight:800}.navnow .sm{font-size:10.5px;color:var(--mut)}
svg{display:block;width:100%}
/* trades */
.log{max-height:280px;overflow:auto}
.row{display:grid;grid-template-columns:58px 46px 1fr 60px 64px;gap:6px;align-items:center;
  padding:8px 3px;border-bottom:1px solid rgba(96,132,210,.1);font-size:12.5px;animation:fin .4s ease}
@keyframes fin{from{opacity:0;transform:translateY(-4px)}}
.tm{color:var(--mut);font-size:10.5px}
.op{font-size:10.5px;font-weight:800;text-align:center;border-radius:5px;padding:2px 0}
.op.b{background:rgba(245,196,81,.15);color:var(--gold)}.op.s{background:rgba(124,92,255,.18);color:#b3a4ff}
.nm2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm2 small{color:var(--mut);font-size:10px}
.qp{text-align:right;color:var(--mut);font-size:11px}.pl{text-align:right;font-weight:800}
.empty{color:var(--mut);font-size:12.5px;text-align:center;padding:30px 0}
.hold{display:flex;justify-content:space-between;padding:8px 3px;font-size:12.5px;border-bottom:1px solid rgba(96,132,210,.1)}
/* locked */
.lk{display:flex;align-items:center;gap:10px;padding:13px 12px;margin-bottom:10px;border-radius:12px;
  border:1px dashed rgba(124,92,255,.4);background:linear-gradient(120deg,rgba(40,30,70,.4),rgba(16,18,34,.3));position:relative}
.lk .ico{font-size:18px}
.lk .blur{flex:1;font-size:16px;font-weight:800;letter-spacing:4px;color:#9b8bff;filter:blur(.4px);text-shadow:0 0 12px rgba(124,92,255,.7)}
.lk .pro{font-size:10px;font-weight:800;color:#05080f;background:linear-gradient(90deg,var(--gold),#ffd87a);padding:3px 9px;border-radius:6px}
.lockNote{font-size:11px;color:var(--mut);text-align:center;margin-top:4px}
.foot{margin-top:14px;font-size:10.5px;color:var(--mut);text-align:center;letter-spacing:.5px;line-height:1.7}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(96,132,210,.3);border-radius:3px}

/* ============================================================
   ===============  CYBERPUNK UPGRADE (集中管理)  ==============
   仅视觉：背景/玻璃卡/霓虹/HUD/动效/层级。不改任何JS与数据。
   主色 cyan #27e0e6 · 紫 #7c5cff · 金 #f5c451 · 涨红 #ff4d57 跌绿 #19d07a
   ============================================================ */
:root{--c:#27e0e6;--v:#7c5cff}
body{background-color:#04060d}
body::before{/* 远处光晕 + 更深的黑蓝渐变 */
  content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(60vw 40vw at 78% -6%,rgba(39,224,230,.10),transparent 60%),
    radial-gradient(50vw 38vw at 8% 4%,rgba(124,92,255,.12),transparent 58%),
    radial-gradient(46vw 44vw at 52% 116%,rgba(245,196,81,.06),transparent 60%),
    linear-gradient(180deg,#060a14 0%,#04060d 60%,#03040a 100%);}
/* 细网格 + 粒子光点层 */
.fx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;opacity:.55;
  background-image:linear-gradient(rgba(96,132,210,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(96,132,210,.05) 1px,transparent 1px);
  background-size:44px 44px;animation:gridDrift 70s linear infinite}
@keyframes gridDrift{to{background-position:44px 44px,44px 44px}}
.fx::before,.fx::after{content:"";position:absolute;inset:-20%;background-repeat:repeat;
  background-image:radial-gradient(1.4px 1.4px at 20% 30%,rgba(39,224,230,.8),transparent),
    radial-gradient(1.2px 1.2px at 70% 60%,rgba(124,92,255,.7),transparent),
    radial-gradient(1.3px 1.3px at 45% 85%,rgba(39,224,230,.6),transparent),
    radial-gradient(1.1px 1.1px at 85% 20%,rgba(245,196,81,.5),transparent),
    radial-gradient(1.2px 1.2px at 12% 70%,rgba(39,224,230,.5),transparent);
  background-size:480px 480px;animation:floaty 24s linear infinite;opacity:.5}
.fx::after{background-size:360px 360px;animation-duration:38s;animation-direction:reverse;opacity:.32}
@keyframes floaty{from{transform:translateY(0)}to{transform:translateY(-480px)}}

/* 顶栏：玻璃 + 入场淡入 */
.bar{animation:fadeDown .7s cubic-bezier(.2,.7,.2,1) both;
  background:linear-gradient(180deg,rgba(18,28,52,.78),rgba(7,11,22,.62));box-shadow:0 8px 40px -18px rgba(39,224,230,.4)}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}}
.logo{position:relative}
.logo::after{content:"";position:absolute;inset:-3px;border-radius:13px;border:1px solid rgba(39,224,230,.35);animation:ringPulse 2.8s ease-out infinite}
/* KPI → 横向小卡片，等宽数字 */
.kpis{gap:10px}
.kpi{padding:7px 13px;border:1px solid var(--line);border-radius:11px;background:rgba(12,20,38,.5);
  position:relative;overflow:hidden;transition:.25s}
.kpi:hover{border-color:rgba(39,224,230,.45);box-shadow:0 0 18px -6px rgba(39,224,230,.6)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(var(--c),var(--v));opacity:.7}
.live{box-shadow:inset 0 0 14px -6px rgba(39,224,230,.7)}
.live .dot{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1;box-shadow:0 0 12px var(--c)}50%{opacity:.35;box-shadow:0 0 4px var(--c)}}
/* 每日入场倒计时 */
.cd{display:flex;flex-direction:column;align-items:flex-end;border:1px solid rgba(245,196,81,.32);border-radius:12px;
  padding:6px 13px;background:rgba(245,196,81,.06);box-shadow:inset 0 0 16px -7px rgba(245,196,81,.8)}
.cd .cdk{font-size:9.5px;color:var(--mut);letter-spacing:1px;margin-bottom:1px}
.cd .cdv{font-size:20px;font-weight:800;color:var(--gold);letter-spacing:1px;text-shadow:0 0 14px rgba(245,196,81,.55)}
.empty.lockpos{color:var(--v);letter-spacing:1px;text-shadow:0 0 12px rgba(124,92,255,.5)}

/* ticker：发光行情带 */
.ticker{box-shadow:0 0 24px -12px rgba(39,224,230,.6)}
.ticker .tag{background:linear-gradient(90deg,#27e0e6,#27a8e6);box-shadow:0 0 16px -4px var(--c)}
.tk b{text-shadow:0 0 10px rgba(39,224,230,.6)}
.tk .r{color:var(--up)} .tk .g{color:var(--down)}

/* 卡片：cyber glass + 入场 slide-up + hover 上浮 */
.deck>.card{animation:cardIn .6s cubic-bezier(.2,.7,.2,1) both}
.deck>.card:nth-child(1){animation-delay:.06s}.deck>.card:nth-child(2){animation-delay:.12s}
.deck>.card:nth-child(3){animation-delay:.18s}.deck>.card:nth-child(4){animation-delay:.24s}
.deck>.card:nth-child(5){animation-delay:.30s}.deck>.card:nth-child(6){animation-delay:.36s}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.card{border-color:rgba(39,224,230,.18);
  background:linear-gradient(180deg,rgba(13,21,40,.72),rgba(8,13,26,.6));
  box-shadow:0 1px 0 rgba(39,224,230,.12) inset,0 18px 50px -30px rgba(0,0,0,.9);transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-3px);border-color:rgba(39,224,230,.42);
  box-shadow:0 0 0 1px rgba(39,224,230,.18),0 22px 60px -28px rgba(39,224,230,.35)}
.card::before{background:linear-gradient(90deg,transparent,rgba(39,224,230,.7),rgba(124,92,255,.5),transparent)}
.cor{width:15px;height:15px;border-color:rgba(39,224,230,.55)}
/* HUD 状态小标签 */
.hud{display:inline-block;font-size:9px;letter-spacing:2px;font-weight:800;color:#04060d;
  background:linear-gradient(90deg,var(--c),#3fd0ff);padding:2px 7px;border-radius:5px;margin-right:8px;
  box-shadow:0 0 14px -4px var(--c);vertical-align:middle}
.c-lock .hud{background:linear-gradient(90deg,var(--v),#9b8bff)}
.c-trades .hud,.c-hold .hud{background:linear-gradient(90deg,#f5c451,#ffd87a)}

/* AI 评分环：脉冲外圈 + 全息感 */
.ringRow{position:relative}
.ringRow::before{content:"";position:absolute;left:50%;top:50%;width:122px;height:122px;margin:-61px 0 0 -61px;
  border-radius:50%;border:1px solid rgba(39,224,230,.45);animation:ringPulse 2.6s ease-out infinite}
@keyframes ringPulse{0%{transform:scale(.82);opacity:.75}100%{transform:scale(1.28);opacity:0}}
#rSvg{filter:drop-shadow(0 0 8px rgba(39,224,230,.45))}
.radarWrap{position:relative}
.radarWrap::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(closest-side,rgba(39,224,230,.10),transparent 70%)}

/* K线区：网格底 + 标题 confidence */
.kl{background-image:linear-gradient(rgba(96,132,210,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(96,132,210,.06) 1px,transparent 1px);
  background-size:100% 25%,8% 100%;border-radius:10px}
#kTitle{text-shadow:0 0 12px rgba(39,224,230,.4)}
#kSvg{animation:chartFade .8s ease both}
@keyframes chartFade{from{opacity:0}to{opacity:1}}

/* 净值卡 */
.navnow .big{text-shadow:0 0 16px rgba(39,224,230,.4)}

/* 表格行 hover + pill */
.row:hover,.hold:hover{background:rgba(39,224,230,.05)}
.op,.pill{box-shadow:0 0 12px -5px currentColor}

/* 锁定信号卡：高级 PRO */
.lk{background:linear-gradient(120deg,rgba(45,32,80,.5),rgba(14,18,34,.4));box-shadow:inset 0 0 30px -16px rgba(124,92,255,.8)}
.lk .pro{box-shadow:0 0 16px -4px rgba(245,196,81,.9)}
.lk:hover{border-color:rgba(124,92,255,.7)}

/* 宽屏适配 */
@media(min-width:1700px){.wrap{max-width:1820px}.kpi .v{font-size:26px}}

/* ====== 唯一首选=主角 · 数字精修 · 选股特色 ====== */
.mono{font-family:ui-monospace,"Cascadia Mono",Consolas,"SF Mono","Roboto Mono",Menlo,monospace;font-feature-settings:"tnum" 1;letter-spacing:.3px}
.kpi .v{font-weight:800;letter-spacing:.5px}
.navnow .big{letter-spacing:.5px}
@media(min-width:1181px){.c-sig{grid-column:span 4}.c-kline{grid-column:span 5}}
.c-sig{position:relative}
.c-sig::after{content:"";position:absolute;inset:-1px;border-radius:16px;padding:1.4px;pointer-events:none;z-index:1;
  background:linear-gradient(135deg,var(--c),transparent 30%,transparent 70%,var(--gold));opacity:.5;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:heroGlow 4.5s ease-in-out infinite}
@keyframes heroGlow{50%{opacity:1}}
.heroLabel{display:inline-block;font-size:10.5px;letter-spacing:2.5px;font-weight:800;color:#04060d;
  background:linear-gradient(90deg,var(--gold),#ffd87a);padding:4px 11px;border-radius:7px;margin-bottom:12px;box-shadow:0 0 18px -4px rgba(245,196,81,.9)}
.c-sig .sigName{font-size:24px;line-height:1.45}
.c-sig .sigName .c{font-size:13px}
.c-sig .sigPx{margin:8px 0 11px;align-items:baseline}
.c-sig .sigPx .p{font-size:38px;letter-spacing:.5px;line-height:1.02}
.c-sig .sigPx .ch{font-size:16px;font-weight:800}
.distinct{font-size:12px;color:var(--mut);background:rgba(39,224,230,.05);border:1px solid var(--line);
  border-radius:9px;padding:8px 11px;margin-bottom:10px;line-height:1.5}
.distinct b{color:var(--txt);font-weight:800} .distinct b.cy{color:var(--cyan)}
.facbadges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.fb{font-size:11.5px;color:#9fb3d8;border:1px solid var(--line);border-radius:7px;padding:4px 9px;background:rgba(20,28,48,.5)}
.fb b{color:var(--cyan);font-weight:800;margin-left:2px}
.fb.top{border-color:rgba(245,196,81,.55);background:rgba(245,196,81,.1);color:var(--gold);box-shadow:0 0 12px -5px rgba(245,196,81,.8)}
.fb.top b{color:var(--gold)}
.ringRow{margin:4px 0 8px}

@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="scan"></div>
<div class="fx"></div>
<div class="wrap">
  <div class="bar">
    <div class="brand"><div class="logo">⬡</div>
      <div><b>CRAYXUS&nbsp;AI</b><div class="sub">QUANT&nbsp;·&nbsp;量化自动交易终端</div></div></div>
    <div class="kpis">
      <div class="kpi"><div class="k">总资产</div><div class="v mono" id="kNav">—</div></div>
      <div class="kpi"><div class="k">累计收益</div><div class="v mono" id="kRet">—</div></div>
      <div class="kpi"><div class="k">今日盈亏</div><div class="v mono" id="kToday">—</div></div>
      <div class="kpi"><div class="k">胜率</div><div class="v mono" id="kWin">—</div></div>
      <div class="kpi"><div class="k">最大回撤</div><div class="v mono" id="kDD">—</div></div>
    </div>
    <div class="live"><span class="dot"></span><span id="liveTxt">LIVE</span></div>
    <div class="cd"><span class="cdk">下次自动建仓 · 14:45 尾盘</span><span class="cdv mono" id="cd">--:--:--</span></div>
  </div>

  <div class="ticker"><div class="tag">AI ENGINE</div><div class="tk mono" id="tk">引擎初始化…</div></div>

  <div class="deck">
    <!-- AI 首选信号 -->
    <div class="card c-sig"><span class="cor tl"></span><span class="cor br"></span>
      <div class="h"><div class="t"><span class="hud">AI SIGNAL</span>★&nbsp;AI&nbsp;<b>首选信号</b></div><div class="tag2" id="sigMkt">ETF</div></div>
      <div id="sigBox"><div class="empty">等待 AI 选股…</div></div>
    </div>
    <!-- 日线图 -->
    <div class="card c-kline"><span class="cor tl"></span><span class="cor br"></span>
      <div class="h"><div class="t"><span class="hud">LIVE CHART</span>日线&nbsp;<b id="kTitle">K线</b></div><div class="tag2" id="kConf">日线</div></div>
      <div class="kl"><svg id="kSvg" viewBox="0 0 800 320" preserveAspectRatio="none" style="height:300px"></svg></div>
      <div class="legend" id="kLegend"></div>
      <div class="ladder" id="ladder"></div>
    </div>
    <!-- 净值 -->
    <div class="card c-nav"><span class="cor tl"></span><span class="cor br"></span>
      <div class="h"><div class="t"><span class="hud">EQUITY</span>净值&nbsp;<b>曲线</b></div><div class="tag2" id="modeTag">—</div></div>
      <div class="navwrap"><svg id="navSvg" viewBox="0 0 600 142" preserveAspectRatio="none" style="height:142px"></svg>
        <div class="navnow"><div class="big mono" id="navBig">—</div><div class="sm" id="navSm"></div></div></div>
    </div>
    <!-- 自动交易记录 -->
    <div class="card c-trades"><span class="cor tl"></span><span class="cor br"></span>
      <div class="h"><div class="t"><span class="hud">EXECUTION</span>自动交易&nbsp;·&nbsp;<b>每日记录</b></div><div class="tag2" id="tradeCnt">0 笔</div></div>
      <div class="log" id="log"><div class="empty">等待开盘自动建仓…</div></div>
    </div>
    <!-- 持仓 -->
    <div class="card c-hold"><span class="cor tl"></span><span class="cor br"></span>
      <div class="h"><div class="t"><span class="hud">PORTFOLIO</span>当前&nbsp;<b>持仓</b></div><div class="tag2" id="holdCnt">0</div></div>
      <div id="holds"><div class="empty">空仓</div></div>
    </div>
    <!-- 锁定信号 -->
    <div class="card c-lock"><span class="cor tl"></span><span class="cor br"></span>
      <div class="h"><div class="t"><span class="hud">SECURE</span>候选&nbsp;<b>信号</b></div><div class="tag2">PRO</div></div>
      <div id="locked"></div>
      <div class="lockNote">完整版解锁全部 AI 信号</div>
    </div>
  </div>
  <div class="foot" id="foot">CRAYXUS AI Quant · 自动刷新中</div>
</div>

<script>
var REVEAL=1;
function el(i){return document.getElementById(i);}
function fmt(n,d){ if(n===null||n===undefined||isNaN(n))return '—'; return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function cls(n){return n>0?'up':(n<0?'down':'');}
function sign(n,d){return (n>0?'+':'')+fmt(n,d);}
function dec(p){return p<10?3:2;}

async function tick(){
  try{ var r=await fetch('track.json?_='+Date.now()); if(!r.ok)throw 0; render(await r.json()); el('liveTxt').textContent='LIVE'; }
  catch(e){ el('liveTxt').textContent='连接引擎…'; }
}

function render(d){
  animK('kNav',d.nav,function(v){return '¥'+fmt(v,0)},'');
  animK('kRet',d.total_return_pct,function(v){return sign(v,2)+'%'},cls(d.total_return_pct));
  animK('kToday',d.today_pnl||0,function(v){return (Math.abs(v)<0.5?'0':sign(v,0))},cls(d.today_pnl||0));
  animK('kWin',d.win_rate_pct==null?0:d.win_rate_pct,function(v){return d.win_rate_pct==null?'—':fmt(v,0)+'%'},'cy');
  animK('kDD',d.max_drawdown_pct||0,function(v){return '-'+fmt(v,2)+'%'},'down');
  el('modeTag').textContent=d.mode||'—';
  el('sigMkt').textContent=(d.market==='etf'?'ETF':'股票');
  el('foot').textContent='CRAYXUS AI Quant v1 · '+(d.mode||'')+' · 数据'+(d.source||'')+' · 更新 '+(d.updated||'')+' · 8秒自动刷新 · 模拟盘';

  var sg=d.signal;
  // ticker
  var tkt='';
  if(sg){ tkt='◆ AI 引擎在线　◆ 首选 <b>'+sg.name+'</b> 评分 <b>'+Math.round(sg.score||0)+'</b>　◆ 现价 '
      +fmt(sg.price,dec(sg.price))+' <span class="'+(sg.chg>=0?'r':'g')+'">'+(sg.chg>=0?'▲':'▼')+sign(sg.chg,2)+'%</span>　'
      +'◆ 止盈 <span class="r">'+fmt(sg.tp,dec(sg.tp))+'</span>　◆ 止损 <span class="g">'+fmt(sg.sl,dec(sg.sl))+'</span>　'
      +'◆ 策略 尾盘买·次日止盈止损　◆ 胜率 '+(d.win_rate_pct==null?'—':d.win_rate_pct+'%')+'　◆ 累计 '+sign(d.total_return_pct,2)+'%　'; }
  else tkt='◆ AI 引擎在线　◆ 等待开盘自动建仓　◆ 策略 尾盘买入·次日止盈止损　';
  el('tk').innerHTML=tkt+tkt;

  // signal card
  if(sg){
    el('kTitle').textContent=sg.code+' '+sg.name;
    el('kConf').textContent='AI 置信度 '+Math.round(sg.score||0)+'% · 日线 D';
    var c=cls(sg.chg);
    var fac=sg.factors||{}, fkeys=Object.keys(fac).sort(function(a,b){return fac[b]-fac[a];});
    var fbad=fkeys.slice(0,3).map(function(k,i){return '<span class="fb'+(i===0?' top':'')+'">'+k+' <b>'+fac[k]+'</b></span>';}).join('');
    var stg=(sg.score>=85?'极强':(sg.score>=72?'强':'中性')), pool=sg.pool||'全市场';
    el('sigBox').innerHTML=
      '<div class="heroLabel">★ 今日 AI 唯一首选 · TODAY&rsquo;S PICK</div>'
      +'<div class="sigName">'+sg.name+'<span class="c mono">'+sg.code+'</span>'
        +'<span class="pill '+(sg.held?'hold':'watch')+'">'+(sg.held?'持有中':'AI 选中')+'</span></div>'
      +'<div class="sigPx"><span class="p mono '+c+'">'+fmt(sg.price,dec(sg.price))+'</span>'
        +'<span class="ch mono '+c+'">'+(sg.chg>=0?'▲':'▼')+sign(sg.chg,2)+'%</span></div>'
      +'<div class="distinct">全市场 <b>'+pool+'</b> 选 <b>1</b>　·　综合 <b>第 1</b>　·　信号强度 <b class="cy">'+stg+'</b></div>'
      +'<div class="facbadges">'+fbad+'<span class="fb">综合 <b>'+Math.round(sg.score||0)+'</b></span></div>'
      +'<div class="ringRow"><svg id="ringSvg" viewBox="0 0 112 112" style="width:152px;height:152px"></svg></div>'
      +'<div class="radarWrap"><svg id="rSvg" viewBox="0 0 180 172" style="width:100%;max-width:250px;height:158px"></svg></div>';
    drawRing(sg.score); drawRadar(sg.factors||{});
    var Lp=sg.ladder;
    var chBuy=sg.buy, chTp=(Lp?Lp.tp_price:sg.tp), chSl=(Lp?Lp.hard_price:sg.sl);
    drawLine(sg.bars||[], chBuy, chTp, chSl);
    el('kLegend').innerHTML=
      '<span class="lvBuy">● '+(sg.held?'持仓均价':'参考买入')+' <b class="mono">'+fmt(chBuy,dec(chBuy))+'</b></span>'
      +'<span class="lvTp">● 止盈 <b class="mono">'+fmt(chTp,dec(chTp))+'</b></span>'
      +'<span class="lvSl">● 硬止损 <b class="mono">'+fmt(chSl,dec(chSl))+'</b></span>';
    renderLadder(Lp, sg.held);
  }else{ el('sigBox').innerHTML='<div class="empty">等待 AI 选股…</div>'; el('kSvg').innerHTML=''; el('kLegend').innerHTML=''; el('ladder').innerHTML=''; }

  // nav
  drawNav(d.nav_history||[], d.init_cash||100000);
  el('navBig').textContent='¥'+fmt(d.nav,0); el('navSm').textContent='本金 ¥'+fmt(d.init_cash,0);

  // trades
  var tr=(d.trades||[]).slice().reverse(); el('tradeCnt').textContent=(d.trades||[]).length+' 笔';
  var lh=''; if(!tr.length)lh='<div class="empty">等待开盘自动建仓…</div>';
  tr.forEach(function(t){ var isBuy=t.side==='BUY';
    var qtyTxt=(t.qty==null?'***':t.qty+'股');
    var pl='';
    if(t.pnl_pct!=null){ pl='<span class="'+cls(t.pnl_pct)+'">'+(t.pnl!=null?sign(t.pnl,0)+'<br>':'')+'<small>'+sign(t.pnl_pct,2)+'%</small></span>'; }
    lh+='<div class="row"><span class="tm mono">'+(t.day||'').slice(5)+'<br>'+(t.time||'')+'</span>'
      +'<span class="op '+(isBuy?'b':'s')+'">'+(isBuy?'买入':'卖出')+'</span>'
      +'<span class="nm2">'+t.name+' <small class="mono">'+t.code+'</small>'+(t.reason?'<br><small>'+t.reason+'</small>':'')+'</span>'
      +'<span class="qp mono">'+qtyTxt+'<br>'+fmt(t.price,dec(t.price))+'</span>'
      +'<span class="pl mono">'+pl+'</span></div>'; });
  el('log').innerHTML=lh;

  // holdings
  var hd=d.holdings||[];
  if(d.hidden_positions){ el('holdCnt').textContent='🔒'; el('holds').innerHTML='<div class="empty lockpos">🔒 仓位已隐藏</div>'; }
  else { el('holdCnt').textContent=hd.length;
    if(hd.length){ var hh=''; hd.forEach(function(h){
      hh+='<div class="hold"><span>'+h.name+' <small class="mono" style="color:var(--mut)">'+h.code+'</small><br>'
        +'<small style="color:var(--mut)">'+h.qty+'股 @'+fmt(h.avg,dec(h.avg))+'</small></span>'
        +'<span class="pl mono '+cls(h.pnl)+'">'+sign(h.pnl,0)+'<br><small>'+sign(h.pnl_pct,2)+'%</small></span></div>'; });
      el('holds').innerHTML=hh;
    }else el('holds').innerHTML='<div class="empty">空仓 · 待开盘建仓</div>'; }

  // locked #2/#3
  var lk=''; (d.top3||[]).forEach(function(t,i){ if(i<REVEAL)return;
    lk+='<div class="lk"><span class="ico">🔒</span><span class="blur">＊＊＊＊＊</span><span class="pro">PRO</span></div>'; });
  if(!lk) lk='<div class="empty">—</div>';
  el('locked').innerHTML=lk;
}

function setK(id,txt,c){var e=el(id);e.textContent=txt;e.className='v mono'+(c?(' '+c):'');}
/* KPI 数字 counting 动画（纯展示，数据不变） */
var _kpi={};
function animK(id,val,fmtFn,c){
  var e=el(id); if(!e)return; e.className='v mono'+(c?(' '+c):'');
  var from=(id in _kpi)?_kpi[id]:0; _kpi[id]=val;
  if(typeof requestAnimationFrame!=='function'||!isFinite(val)||from===val){e.textContent=fmtFn(val);return;}
  var t0=null,dur=650;
  function step(ts){ if(t0===null)t0=ts; var p=Math.min(1,(ts-t0)/dur),k=0.5-Math.cos(p*Math.PI)/2;
    e.textContent=fmtFn(from+(val-from)*k); if(p<1)requestAnimationFrame(step); }
  requestAnimationFrame(step);
}

function renderLadder(L,held){
  if(!L){ el('ladder').innerHTML=''; return; }
  var s='<div class="lhead">楼梯加仓计划（每跌1%加一档，止盈清仓）<span class="g">已加仓 '+L.adds+'/'+(L.plan.length-1)+'</span></div><div class="lsteps">';
  L.plan.forEach(function(p){ var done=held&&p.n<=L.adds;
    s+='<div class="lstep'+(done?' done':'')+'"><span>'+p.label+'</span><b>'+p.qty+'股</b><i class="mono">'+fmt(p.price,dec(p.price))+'</i></div>'; });
  s+='<div class="lstep tp"><span>止盈·清仓</span><b>均价+1%</b><i class="mono">'+fmt(L.tp_price,dec(L.tp_price))+'</i></div>';
  s+='<div class="lstep stop"><span>硬止损·清仓</span><b>首仓-4%</b><i class="mono">'+fmt(L.hard_price,dec(L.hard_price))+'</i></div>';
  el('ladder').innerHTML=s+'</div>';
}

/* ---- AI 评分环 ---- */
function drawRing(score){
  var s=Math.max(0,Math.min(100,score||0)),R=44,cx=56,cy=56,C=2*Math.PI*R,off=C*(1-s/100);
  var col=s>=80?'#27e0e6':(s>=60?'#f5c451':'#ff8a3d');
  el('ringSvg').innerHTML=
    '<circle cx="56" cy="56" r="44" fill="none" stroke="rgba(111,130,173,.18)" stroke-width="9"/>'
    +'<circle cx="56" cy="56" r="44" fill="none" stroke="'+col+'" stroke-width="9" stroke-linecap="round" '
    +'stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 56 56)" '
    +'style="filter:drop-shadow(0 0 7px '+col+');transition:stroke-dashoffset 1s ease"/>'
    +'<text x="56" y="60" text-anchor="middle" fill="#fff" font-size="30" font-weight="800" font-family="monospace">'+Math.round(s)+'</text>'
    +'<text x="56" y="76" text-anchor="middle" fill="#6f82ad" font-size="9.5" letter-spacing="1">AI 综合评分</text>';
}
/* ---- 因子雷达 ---- */
function drawRadar(f){
  var keys=['趋势','动量','量能','换手','资金','估值'],cx=90,cy=84,R=54,n=keys.length;
  function pt(i,r){var a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r];}
  var g='';[.25,.5,.75,1].forEach(function(k){g+='<polygon points="'+keys.map(function(_,i){return pt(i,R*k).map(function(v){return v.toFixed(1)}).join(',')}).join(' ')+'" fill="none" stroke="rgba(111,130,173,.16)"/>';});
  var ax='',lb='';keys.forEach(function(k,i){var e=pt(i,R);ax+='<line x1="90" y1="84" x2="'+e[0].toFixed(1)+'" y2="'+e[1].toFixed(1)+'" stroke="rgba(111,130,173,.16)"/>';var lp=pt(i,R+13);lb+='<text x="'+lp[0].toFixed(1)+'" y="'+(lp[1]+3).toFixed(1)+'" fill="#7689b3" font-size="10" text-anchor="middle">'+k+'</text>';});
  var poly=keys.map(function(k,i){return pt(i,R*((f[k]||0)/100)).map(function(v){return v.toFixed(1)}).join(',')}).join(' ');
  el('rSvg').innerHTML=g+ax
    +'<polygon points="'+poly+'" fill="rgba(39,224,230,.2)" stroke="#27e0e6" stroke-width="1.7" style="filter:drop-shadow(0 0 5px rgba(39,224,230,.6))"/>'+lb;
}
/* ---- 日线折线图（同花顺日线感）+ 止盈/止损/买入位 ---- */
function drawLine(bars,buy,tp,sl){
  var svg=el('kSvg'); if(!bars||!bars.length){svg.innerHTML='';return;}
  var W=800,H=320,pL=6,pR=62,pT=14,pB=20;
  var cl=bars.map(function(b){return b.c;});
  var lo=Math.min.apply(null,cl),hi=Math.max.apply(null,cl);
  [buy,tp,sl].forEach(function(v){if(v){lo=Math.min(lo,v);hi=Math.max(hi,v);}});
  var pad=(hi-lo)*0.10||0.1;lo-=pad;hi+=pad;
  var n=cl.length;
  function X(i){return pL+i*(W-pL-pR)/(n-1);}
  function Y(v){return pT+(hi-v)/(hi-lo)*(H-pT-pB);}
  var last=cl[n-1],col=last>=cl[0]?'#ff4d57':'#19d07a';
  var line='',area='M'+X(0).toFixed(1)+' '+Y(cl[0]).toFixed(1);
  cl.forEach(function(v,i){var x=X(i).toFixed(1),y=Y(v).toFixed(1);line+=(i?'L':'M')+x+' '+y+' ';area+=' L'+x+' '+y;});
  area+=' L'+X(n-1).toFixed(1)+' '+(H-pB)+' L'+X(0).toFixed(1)+' '+(H-pB)+' Z';
  function hl(v,c){if(v==null)return '';var y=Y(v).toFixed(1);
    return '<line x1="'+pL+'" y1="'+y+'" x2="'+(W-pR)+'" y2="'+y+'" stroke="'+c+'" stroke-width="1.1" stroke-dasharray="6 4" opacity=".9"/>'
      +'<rect x="'+(W-pR)+'" y="'+(parseFloat(y)-9)+'" width="'+pR+'" height="18" fill="'+c+'" opacity=".15"/>'
      +'<text x="'+(W-pR+5)+'" y="'+(parseFloat(y)+4.5)+'" fill="'+c+'" font-size="13" font-family="monospace">'+v.toFixed(dec(v))+'</text>';}
  svg.innerHTML='<defs><linearGradient id="kg" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0" stop-color="'+col+'" stop-opacity=".30"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#kg)"/>'
    +hl(buy,'#27e0e6')+hl(tp,'#ff4d57')+hl(sl,'#19d07a')
    +'<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="2.3" style="filter:drop-shadow(0 0 5px '+col+')"/>'
    +'<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(last).toFixed(1)+'" r="3.6" fill="#fff"/>'
    +'<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(last).toFixed(1)+'" r="7" fill="'+col+'" opacity=".35"/>';
}
/* ---- 净值曲线 ---- */
function drawNav(hist,init){
  var pts=hist.map(function(h){return h.nav});if(pts.length<2)pts=[init,(pts[0]||init)];
  var W=600,H=142,pad=8,mn=Math.min.apply(null,pts.concat([init])),mx=Math.max.apply(null,pts.concat([init]));if(mx===mn)mx=mn+1;
  var n=pts.length;function X(i){return pad+i*(W-2*pad)/(n-1);}function Y(v){return H-pad-(v-mn)/(mx-mn)*(H-2*pad);}
  var line='',area='M'+X(0)+' '+Y(pts[0]);
  pts.forEach(function(v,i){var x=X(i).toFixed(1),y=Y(v).toFixed(1);line+=(i?'L':'M')+x+' '+y+' ';area+=' L'+x+' '+y;});
  area+=' L'+X(n-1)+' '+H+' L'+X(0)+' '+H+' Z';
  var up=pts[n-1]>=init,col=up?'#ff4d57':'#19d07a',base=Y(init).toFixed(1);
  el('navSvg').innerHTML='<defs><linearGradient id="ng" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0" stop-color="'+col+'" stop-opacity=".34"/><stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'
    +'<line x1="0" y1="'+base+'" x2="600" y2="'+base+'" stroke="rgba(111,130,173,.32)" stroke-dasharray="4 5"/>'
    +'<path d="'+area+'" fill="url(#ng)"/>'
    +'<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="2" style="filter:drop-shadow(0 0 4px '+col+')"/>'
    +'<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(pts[n-1]).toFixed(1)+'" r="3.4" fill="#fff"/>';
}
tick(); setInterval(tick,8000);
/* 每日入场倒计时（到下一个交易日 14:45 尾盘建仓；仅周一~周五，未含法定节假日） */
function pad(n){return (n<10?'0':'')+n;}
function nextEntry(){
  var now=new Date();
  var t=new Date(now.getFullYear(),now.getMonth(),now.getDate(),14,45,0,0);
  if(t<=now) t.setDate(t.getDate()+1);
  while(t.getDay()===0||t.getDay()===6) t.setDate(t.getDate()+1);
  return t;
}
function tickCD(){
  var ms=nextEntry()-new Date(); if(ms<0)ms=0;
  var s=Math.floor(ms/1000),dd=Math.floor(s/86400);s-=dd*86400;
  var hh=Math.floor(s/3600);s-=hh*3600;var mm=Math.floor(s/60),ss=s-mm*60;
  var e=el('cd'); if(e)e.textContent=(dd>0?dd+'天 ':'')+pad(hh)+':'+pad(mm)+':'+pad(ss);
}
setInterval(tickCD,1000); tickCD();
</script>
</body>
</html>
