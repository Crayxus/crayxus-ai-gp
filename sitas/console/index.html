<!doctype html><html lang=zh-CN><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>控制台演示 · SITAS</title><style>
:root{--ink:#0B1216;--deep:#060A0D;--paper:#FAFBFA;--card:#fff;--line:#E3E8E5;
--steel:#5C6D78;--mute:#8A99A2;--verd:#2E8B72;--verd-soft:#E9F4F0;
--brass:#8A6420;--brass-soft:#FAF3E4;--sub:#F1F4F2;--glow:rgba(46,139,114,.18)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
--ink:#EAF0ED;--deep:#04080A;--paper:#080D10;--card:#101A1F;--line:#1F2C33;
--steel:#93A6AF;--mute:#75868F;--verd:#4FC5A3;--verd-soft:#0E211C;
--brass:#D8AC52;--brass-soft:#241E11;--sub:#0D161A;--glow:rgba(79,197,163,.13)}}
:root[data-theme=dark]{--ink:#EAF0ED;--deep:#04080A;--paper:#080D10;--card:#101A1F;
--line:#1F2C33;--steel:#93A6AF;--mute:#75868F;--verd:#4FC5A3;--verd-soft:#0E211C;
--brass:#D8AC52;--brass-soft:#241E11;--sub:#0D161A;--glow:rgba(79,197,163,.13)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);line-height:1.6;
font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.m{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
.top{background:var(--deep);color:#F2F6F4;padding:0 24px;position:sticky;top:0;z-index:9}
.tin{max-width:1200px;margin:0 auto;display:flex;align-items:center;
justify-content:space-between;height:60px;gap:16px}
.bd b{font-size:18px;letter-spacing:.12em}
.bd span{font-family:ui-monospace,Consolas,monospace;font-size:9px;
letter-spacing:.18em;color:#8FA6B0;margin-left:9px}
.who{display:flex;align-items:center;gap:14px;font-size:13px;color:#8FA6B0}
.who b{color:#F2F6F4}
.who a{color:#8FA6B0;text-decoration:none;border:1px solid #22333E;
border-radius:999px;padding:5px 14px;font-size:12.5px;transition:.18s}
.who a:hover{color:#F2F6F4;border-color:#3A5361}
.wrap{max-width:1200px;margin:0 auto;padding:28px 24px 70px}
.demo{background:var(--brass-soft);border:1px solid var(--brass);color:var(--brass);
border-radius:10px;padding:11px 18px;font-size:13px;margin-bottom:16px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:14px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.kpi .l{font-size:11.5px;color:var(--steel);letter-spacing:.05em}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.03em;margin-top:4px}
.kpi .s{font-size:12px;color:var(--mute);margin-top:2px}
.kpi.warn .v{color:var(--brass)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;
margin-bottom:16px;overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;
padding:16px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h2{margin:0;font-size:15.5px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
input,select{padding:8px 12px;border:1px solid var(--line);border-radius:8px;
background:var(--sub);color:var(--ink);font-size:13px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--verd)}
.btn{padding:8px 16px;border-radius:999px;border:1px solid var(--line);
background:var(--card);color:var(--ink);font-size:13px;cursor:pointer;
font-family:inherit;text-decoration:none;display:inline-block;transition:.18s}
.btn:hover{border-color:var(--verd);color:var(--verd)}
.btn.p{background:var(--verd);border-color:var(--verd);color:#03130E;font-weight:600}
.btn.p:hover{color:#03130E;transform:translateY(-1px)}

.spark{display:flex;align-items:flex-end;gap:3px;height:56px;padding:16px 22px 10px}
.spark i{flex:1;background:var(--verd);border-radius:2px 2px 0 0;min-height:2px;
opacity:.72;transition:opacity .2s}
.spark i:hover{opacity:1}
.sparkl{padding:0 22px 14px;font-size:11.5px;color:var(--mute);
display:flex;justify-content:space-between}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
th,td{text-align:left;padding:11px 22px;border-bottom:1px solid var(--line);
white-space:nowrap}
thead th{background:var(--sub);font-size:11px;color:var(--steel);
letter-spacing:.09em;text-transform:uppercase;font-weight:600;position:sticky;top:60px}
tbody tr:hover{background:var(--sub)}
tbody tr:last-child td{border-bottom:0}
.pill{font-family:ui-monospace,Consolas,monospace;font-size:10.5px;
padding:2px 9px;border-radius:999px;border:1px solid}
.p-ok{color:var(--verd);border-color:var(--verd);background:var(--verd-soft)}
.p-wn{color:var(--brass);border-color:var(--brass);background:var(--brass-soft)}
.empty{padding:44px;text-align:center;color:var(--mute);font-size:13.5px}
.foot{padding:12px 22px;font-size:12px;color:var(--mute);border-top:1px solid var(--line)}
@media(max-width:640px){.wrap{padding:20px 14px 50px}.who b{display:none}}
</style></head><body>

<div class=top><div class=tin>
  <div class=bd><b>SITAS</b><span>控制台 · 演示环境</span></div>
  <div class=who>
    <span id=org></span><b id=nm></b>
    <a href="../">返回官网</a>
  </div>
</div></div>

<div class=wrap>
  <div class=demo>演示环境 · 数据为示例，非真实实验数据。正式部署可置于贵单位内网，数据不出机构。</div>
  <div class=kpis id=kpis></div>

  <div class=panel>
    <div class=ph><h2>近 14 天存证量</h2>
      <div class=tools><a class="btn p" href="report.html" target=_blank>导出合规报告</a></div>
    </div>
    <div class=spark id=spark></div>
    <div class=sparkl><span>14 天前</span><span>今天</span></div>
  </div>

  <div class=panel>
    <div class=ph><h2>采集工位</h2>
      <div class=tools>
        <input id=nd placeholder="新工位标识，如 SITAS-WS-03" style="min-width:210px">
        <input id=nl placeholder="备注" style="min-width:140px">
        <button class=btn onclick=addDev()>添加工位</button>
      </div>
    </div>
    <div class=tw><table><thead><tr>
      <th>工位标识</th><th>备注</th><th>状态</th><th>存证数</th><th>登记时间</th>
    </tr></thead><tbody id=devs></tbody></table></div>
    <div class=foot id=seats></div>
  </div>

  <div class=panel>
    <div class=ph><h2>存证记录</h2>
      <div class=tools>
        <select id=fd onchange=load()><option value="">全部工位</option></select>
        <input id=fq placeholder="操作者 / 项目 / 文件名" oninput=deb()>
      </div>
    </div>
    <div class=tw><table><thead><tr>
      <th>影像文件</th><th>存证时间</th><th>操作者</th><th>项目</th>
      <th>工位</th><th>指纹</th><th>时间戳</th>
    </tr></thead><tbody id=recs></tbody></table></div>
    <div class=foot id=cnt></div>
  </div>
</div>

// 演示版: 拦截 fetch, 用内置数据应答 —— UI 与真实后台完全一致
window.fetch=async(u)=>{
  const p=String(u).split('?')[0].replace('/api/','');
  let d=DEMO[p.split('?')[0]]||DEMO.records;
  if(p==='records'){
    const q=new URLSearchParams(String(u).split('?')[1]||'');
    let rows=DEMO.records.rows;
    const dv=q.get('device'), kw=(q.get('q')||'').trim();
    if(dv) rows=rows.filter(r=>r.device_id===dv);
    if(kw) rows=rows.filter(r=>(r.operator+r.project+r.file_name).includes(kw));
    d={total:rows.length,rows:rows.slice(0,200)};
  }
  await new Promise(r=>setTimeout(r,90));
  return {json:async()=>d};
};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const fmt=t=>new Date(t*1000).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',
  hour:'2-digit',minute:'2-digit'});

async function me(){
  const j=await (await fetch('/api/me')).json();
  if(j.error){location.href='/login';return}
  $('org').textContent=j.org; $('nm').textContent=j.name;
  window.SEATS=j.seats; window.PLAN=j;
}
async function stats(){
  const j=await (await fetch('/api/stats')).json();
  $('kpis').innerHTML=`
   <div class=kpi><div class=l>存证总数</div><div class="v m">${j.total}</div>
     <div class=s>近30天 ${j.last30} 条</div></div>
   <div class=kpi><div class=l>在用工位</div><div class="v m">${j.devices} / ${PLAN.seats}</div>
     <div class=s>${PLAN.plan} 授权</div></div>
   <div class=kpi${j.untrusted?' class=kpi warn':''}><div class=l>待补可信时间戳</div>
     <div class="v m">${j.untrusted}</div>
     <div class=s>${j.untrusted?'建议接入第三方 TSA':'全部已加盖'}</div></div>
   <div class=kpi><div class=l>授权剩余</div><div class="v m">${PLAN.days_left}</div>
     <div class=s>天</div></div>`;
  const mx=Math.max(1,...j.series);
  $('spark').innerHTML=j.series.map(n=>
    `<i style="height:${Math.max(2,n/mx*100)}%" title="${n} 条"></i>`).join('');
}
async function devices(){
  const j=await (await fetch('/api/devices')).json();
  $('devs').innerHTML=j.rows.length?j.rows.map(r=>`<tr>
    <td class=m>${esc(r.device_id)}</td><td>${esc(r.label)||'—'}</td>
    <td><span class="pill ${r.status==='active'?'p-ok':'p-wn'}">
      ${r.status==='active'?'启用':'停用'}</span></td>
    <td class=m>${r.n}</td><td class=m>${fmt(r.created_at)}</td></tr>`).join('')
    :'<tr><td colspan=5 class=empty>还没有登记工位</td></tr>';
  $('seats').textContent=`已用 ${j.rows.filter(r=>r.status==='active').length} / ${j.seats} 个授权工位`;
  $('fd').innerHTML='<option value="">全部工位</option>'+
    j.rows.map(r=>`<option>${esc(r.device_id)}</option>`).join('');
}
async function load(){
  const q=new URLSearchParams({device:$('fd').value,q:$('fq').value,limit:200});
  const j=await (await fetch('/api/records?'+q)).json();
  $('recs').innerHTML=j.rows.length?j.rows.map(r=>`<tr>
    <td>${esc(r.file_name)}</td><td class=m>${esc(r.captured_at).replace('T',' ').replace('+00:00',' UTC')}</td>
    <td>${esc(r.operator)}</td><td class=m>${esc(r.project)}</td>
    <td class=m>${esc(r.device_id)}</td>
    <td class=m title="${esc(r.sha256)}">${esc(r.sha256).slice(0,14)}…</td>
    <td><span class="pill ${r.tsa_trusted?'p-ok':'p-wn'}">
      ${r.tsa_trusted?'第三方':'本地时钟'}</span></td></tr>`).join('')
    :'<tr><td colspan=7 class=empty>没有匹配的记录</td></tr>';
  $('cnt').textContent=`共 ${j.total} 条，显示最近 ${j.rows.length} 条`;
}
let t; const deb=()=>{clearTimeout(t);t=setTimeout(load,260)};
async function addDev(){
  const d=$('nd').value.trim(); if(!d)return;
  alert('演示环境不支持写入。正式版可添加工位，超出授权数会提示扩容。'); return;
  const r=await fetch('/api/devices',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({device_id:d,label:$('nl').value.trim()})});
