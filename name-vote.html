<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>公司命名投票</title>
<meta name="description" content="十一个候选公司名，每人选 3 个，按票数排名。">
<meta property="og:title" content="公司命名投票">
<meta property="og:description" content="十一个候选公司名，每人选 3 个，按票数排名。">
<meta property="og:url" content="https://crayxus.com.au/name-vote.html">
<style>
/* 布局：标题 → 我的选票（名字 + 已选 3 个 + 提交）→ 票数排名 → 十一张候选卡（点卡片选/取消）。票数条是“光轨”，呼应 NEXUS 灯效 */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#12162A; --muted:#5A6378; --line:#DCE1EB;
  --rail:#E7EBF2; --accent:#0B93AE; --accent-ink:#FFFFFF; --glow:rgba(11,147,174,.28);
  --pick:#6D4FD8; --pick-ink:#FFFFFF; --pick-soft:rgba(109,79,216,.10); --warn:#9A5B00; --warn-soft:#FFF4E0;
  --ok:#0F7B4B; --r1:#C98A00;
  --f-display:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1020; --surface:#121A2E; --ink:#E6EAF2; --muted:#8A94AD; --line:#26314F;
  --rail:#1B2540; --accent:#22D3EE; --accent-ink:#06202A; --glow:rgba(34,211,238,.45);
  --pick:#A58BFF; --pick-ink:#140C33; --pick-soft:rgba(165,139,255,.12); --warn:#FBBF24; --warn-soft:rgba(251,191,36,.10);
  --ok:#34D399; --r1:#F5C451; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1020; --surface:#121A2E; --ink:#E6EAF2; --muted:#8A94AD; --line:#26314F;
  --rail:#1B2540; --accent:#22D3EE; --accent-ink:#06202A; --glow:rgba(34,211,238,.45);
  --pick:#A58BFF; --pick-ink:#140C33; --pick-soft:rgba(165,139,255,.12); --warn:#FBBF24; --warn-soft:rgba(251,191,36,.10);
  --ok:#34D399; --r1:#F5C451; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:calc(36px + env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1080px;margin:0 auto;display:grid;gap:24px}
header{display:grid;gap:10px}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.oct{width:18px;height:18px;flex:none}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,5vw,44px);line-height:1.15;margin:0;text-wrap:balance}
h2.sec{font-size:13px;letter-spacing:.12em;color:var(--muted);margin:0 0 10px;font-weight:700}
.lede{margin:0;color:var(--muted);max-width:62ch}
.lede b{color:var(--ink)}
.status{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:14px;color:var(--muted)}
.status b{font-family:var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px;vertical-align:middle}
.dot.live{background:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.me{display:grid;gap:14px}
.me-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.me label{font-weight:700;font-size:14px}
.me input{flex:1 1 180px;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.me input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.picked{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.picked{grid-template-columns:minmax(0,1fr)}}
.slot{display:flex;align-items:center;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;min-width:0;min-height:46px;color:var(--muted);font-size:14px}
.slot.on{border-style:solid;border-color:var(--pick);background:var(--pick-soft);color:var(--ink);font-weight:700}
.slot span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.hint{font-size:13px;color:var(--muted)}
.hint.ok{color:var(--ok)}
.actions{display:flex;align-items:center;gap:14px;margin-left:auto}
.submit{appearance:none;border:0;font:inherit;font-weight:700;font-size:15px;border-radius:12px;padding:11px 28px;background:var(--accent);color:var(--accent-ink);cursor:pointer;transition:box-shadow .2s,transform .1s,opacity .2s}
.submit:hover{box-shadow:0 0 0 4px var(--glow)}
.submit:active{transform:scale(.98)}
.submit:focus-visible{outline:3px solid var(--pick);outline-offset:2px}
.submit:disabled{opacity:.45;cursor:default;box-shadow:none;transform:none}
.link{appearance:none;background:none;border:0;padding:4px 0;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:disabled{cursor:default;text-decoration:none;opacity:.6}
.notice{border:1px solid var(--line);background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px}
.board{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:28px minmax(0,17em) minmax(0,1fr) auto;align-items:center;gap:12px}
@media (max-width:560px){.row{grid-template-columns:24px minmax(0,1fr) auto;row-gap:6px}.row .pos,.row .row-nm,.row .row-sc{grid-row:1}.row .rail{grid-row:2;grid-column:2/4}}
.pos{font-family:var(--f-mono);font-weight:700;color:var(--muted);text-align:center}
.row.lead .pos{color:var(--r1)}
.row-nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sc{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}
.row-sc b{font-size:16px;color:var(--ink)}
.empty{color:var(--muted);font-size:14px;margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{display:grid;grid-template-rows:1fr auto auto;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 20px 18px;min-width:0;transition:border-color .2s,box-shadow .2s}
.card.sel{border-color:var(--pick);box-shadow:0 0 0 3px var(--pick-soft)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.zh{font-family:var(--f-display);font-weight:900;font-size:clamp(19px,2vw,21px);line-height:1.35;margin:0}
.zh span{white-space:nowrap}
.badge{flex:none;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.tally{display:grid;gap:8px}
.count{font-family:var(--f-mono);font-weight:700;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.tally-row{font-size:13px;color:var(--muted)}
.rail{height:6px;border-radius:999px;background:var(--rail);overflow:hidden}
.fill{height:100%;width:0;border-radius:inherit;background:var(--accent);box-shadow:0 0 12px var(--glow);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.voters{display:flex;flex-wrap:wrap;gap:6px;min-height:24px;align-items:center}
.chip{font-size:12px;line-height:1;padding:5px 9px;border-radius:999px;background:var(--rail);color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.choose{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14px;font-weight:700;border-radius:10px;padding:10px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.choose:hover{border-color:var(--pick)}
.choose:active{transform:scale(.98)}
.choose:focus-visible{outline:3px solid var(--pick);outline-offset:2px}
.choose[aria-pressed="true"]{background:var(--pick);border-color:var(--pick);color:var(--pick-ink)}
.choose:disabled{opacity:.45;cursor:default;transform:none}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
@media (prefers-reduced-motion:reduce){.fill,.card,.choose,.submit{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">
      <svg class="oct" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2h8l6 6v8l-6 6H8l-6-6V8z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>
      EI TOKEN · 新公司命名
    </div>
    <h1>十一个名字，选出你最喜欢的三个</h1>
    <p class="lede">在下面的卡片里<b>选 3 个</b>，填上你的名字，点<b>提交</b>。每个名字算 1 票，最后按票数排名。提交后还能改，改完再提交一次就行。</p>
    <div class="status"><span><span class="dot" id="dot"></span><span id="conn">正在读取票数…</span></span><span>已投票 <b id="total">0</b> 人</span></div>
  </header>

  <section class="panel me" aria-labelledby="me-h">
    <h2 class="sec" id="me-h">我的选票</h2>
    <div class="me-row">
      <label for="name">你的名字</label>
      <input id="name" maxlength="20" autocomplete="name" placeholder="例如：张三">
    </div>
    <div class="picked" id="picked"></div>
    <div class="me-foot">
      <span class="hint" id="hint" aria-live="polite"></span>
      <div class="actions"><button class="link" id="clear" type="button" hidden>撤回我的票</button><button class="submit" id="submit" type="button">提交</button></div>
    </div>
  </section>

  <div class="notice" id="notice" hidden></div>

  <section class="panel" aria-labelledby="board-h">
    <h2 class="sec" id="board-h">票数排名</h2>
    <ol class="board" id="board"></ol>
  </section>

  <section class="grid" id="grid" aria-label="候选名字"></section>
  <footer>最终注册前还要核查企业名称和商标是否可用。</footer>
</div>
<script>
// 从后端自己的 /vote 打开就走同源；放在 crayxus.com.au 上就跨域连后端
const API=(location.pathname==='/vote'?'':'https://api.crayxus.com.au')+'/api/poll/company-name';
const OPTIONS=[
  {id:'yuchengqi',zh:'杭州语成器科技有限公司'},
  {id:'yichengqi',zh:'意成器科技（杭州）有限公司'},
  {id:'yuangou',zh:'元构万机科技（杭州）有限责任公司'},
  {id:'wanjixu',zh:'万机序科技（杭州）有限责任公司'},
  {id:'qiyi',zh:'启绎科技（杭州）有限责任公司'},
  {id:'huisuanzi',zh:'慧算子科技（杭州）有限责任公司'},
  {id:'jizhi',zh:'机智算能（杭州）科技有限公司'},
  {id:'xunzhi',zh:'训智算能科技（杭州）有限公司'},
  {id:'xunzhima',zh:'驯智算能科技（杭州）有限责任公司'},
  {id:'xunsuan',zh:'训算科技（杭州）有限责任公司'},
  {id:'xunhui',zh:'训慧智能'}
];
const N=3;
const BY=Object.fromEntries(OPTIONS.map(o=>[o.id,o]));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let voter=store.get('poll.voter');
if(!/^[A-Za-z0-9_-]{16,64}$/.test(voter)){
  const a=new Uint8Array(18); (crypto.getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256|0));
  voter=Array.from(a,b=>b.toString(16).padStart(2,'0')).join(''); store.set('poll.voter',voter);
}
// sel = 本页正在选的；dirty = 改过还没提交（这时 5 秒轮询不覆盖 sel）
let state={options:{},order:[],total:0,mine:[]}, sel=[], dirty=false, live=false, busy=false, okMsg='';
$('#name').value=store.get('poll.name');
$('#name').addEventListener('input',e=>{store.set('poll.name',e.target.value.trim()); okMsg=''; render();});

function notice(t){const n=$('#notice'); n.textContent=t||''; n.hidden=!t;}
const same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
function render(){
  const total=state.total||0, opt=state.options||{}, mine=state.mine||[];
  const v=id=>(opt[id]&&opt[id].votes)||0;
  const max=Math.max(0,...OPTIONS.map(o=>v(o.id)));
  const lead=max>0?(state.order||[])[0]:null;
  $('#total').textContent=total;
  $('#picked').innerHTML=Array.from({length:N},(_,i)=>{const id=sel[i]; return `<div class="slot${id?' on':''}"><span>${id?esc(BY[id].zh):'还没选'}</span></div>`;}).join('');
  const name=$('#name').value.trim(), submitted=mine.length>0, unchanged=same(sel,mine)&&name===(state.myName||'');
  $('#submit').textContent=submitted?'重新提交':'提交';
  $('#submit').disabled=!live||busy||sel.length!==N||!name||(submitted&&unchanged);
  $('#clear').hidden=!submitted; $('#clear').disabled=busy||!live;
  const h=$('#hint'); h.classList.remove('ok');
  if(okMsg){h.textContent=okMsg; h.classList.add('ok');}
  else if(sel.length<N) h.textContent=`已选 ${sel.length} / ${N}，在下面的卡片上再选 ${N-sel.length} 个。`;
  else if(!name) h.textContent='选好了，填上名字就能提交。';
  else h.textContent=submitted&&unchanged?'这就是你已经提交的选票。':'选好了，点提交。';
  const order=(state.order&&state.order.length?state.order:OPTIONS.map(o=>o.id));
  $('#board').innerHTML=total?order.map((id,i)=>{
    const n=v(id), pct=max?Math.round(n/max*100):0;
    return `<li class="row${i===0&&n>0?' lead':''}"><span class="pos">${i+1}</span><span class="row-nm">${esc(BY[id].zh)}</span><div class="rail"><div class="fill" style="width:${pct}%"></div></div><span class="row-sc"><b>${n}</b> 票</span></li>`;
  }).join(''):'<li class="empty">还没有人投票。选 3 个名字，填上你的名字，点提交。</li>';
  const full=sel.length>=N;
  $('#grid').innerHTML=OPTIONS.map(o=>{
    const d=opt[o.id]||{votes:0,voters:[]}, on=sel.includes(o.id);
    const who=(d.voters||[]).map(n=>`<span class="chip">${esc(n)}</span>`).join('');
    return `<article class="card${on?' sel':''}">
      <div class="top"><h3 class="zh">${esc(o.zh).replace(/（杭州）|有限责任公司|有限公司/g,m=>`<span>${m}</span>`)}</h3>${lead===o.id?'<span class="badge">目前第一</span>':''}</div>
      <div class="tally">
        <div class="tally-row"><span class="count">${d.votes}</span> 票</div>
        <div class="rail"><div class="fill" style="width:${max?Math.round(d.votes/max*100):0}%"></div></div>
        <div class="voters">${who}</div>
      </div>
      <button class="choose" type="button" data-id="${o.id}" aria-pressed="${on}" ${(busy||(!on&&full))?'disabled':''}>${on?'✓ 已选（点击取消）':(full?'已选满 3 个':'选它')}</button>
    </article>`;
  }).join('');
}
async function load(){
  try{
    const r=await fetch(API+'?voter='+encodeURIComponent(voter),{cache:'no-store'});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'读取失败');
    state=j; live=true; $('#conn').textContent='实时更新中'; $('#dot').classList.add('live');
    if(!dirty) sel=(j.mine||[]).slice();
    if(j.myName&&!$('#name').value){$('#name').value=j.myName; store.set('poll.name',j.myName);}
    render();
  }catch(e){ $('#conn').textContent='暂时连不上投票服务器，正在重试…'; $('#dot').classList.remove('live'); if(!live) render(); }
}
async function post(picks){
  busy=true; render();
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({voter,name:$('#name').value.trim(),picks})});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'没提交上');
    state=j; sel=(j.mine||[]).slice(); dirty=false; notice('');
    okMsg=picks.length?'✓ 已提交，谢谢！想改的话重新选，再提交一次。':'已撤回你的票。';
  }catch(err){ notice('没提交上：'+err.message+'。稍等一下再试。'); }
  finally{busy=false; render();}
}
$('#grid').addEventListener('click',e=>{
  const b=e.target.closest('.choose'); if(!b||b.disabled) return;
  const id=b.dataset.id, k=sel.indexOf(id);
  if(k>=0) sel.splice(k,1); else if(sel.length<N) sel.push(id);
  dirty=!same(sel,state.mine||[]); okMsg=''; render();
});
$('#submit').addEventListener('click',()=>{
  if(!$('#name').value.trim()){notice('先填一下你的名字。'); $('#name').focus(); return;}
  post(sel.slice());
});
$('#clear').addEventListener('click',()=>{ if(confirm('确定撤回你的票吗？')) post([]); });
render(); load();
setInterval(()=>{ if(!document.hidden&&!busy) load(); },5000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
</script>
</body>
</html>
