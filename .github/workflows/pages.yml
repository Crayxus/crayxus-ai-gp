name: Deploy Pages

# 自定义 Pages 部署 —— 取代 GitHub 内置构建(legacy)。
#
# 起因(2026-08-06): track-bc3252772c/track.json 每 3 分钟被外部脚本推送一次。
#
# 第一次尝试(concurrency + cancel-in-progress:false)只治住了 Actions 层:
# 部署不再互相中断了, 但 Pages 部署 API 本身是串行的 —— 推送间隔 3 分钟 <
# 单次部署耗时, 队列越排越长, 每个 run 卡在 deployment_queued 直到
# "Timeout reached, aborting!" → 仍然是 failure。
#
# 第二次尝试(paths-ignore + schedule 每 30 分钟)把触发降下来了, 但 run 总数
# 仍有 48+/天, 每撞上一次 GitHub 侧抖动就是一封 failed 邮件。
#
# 2026-08-07 终版 —— 目标: 邮箱不再收到 deploy failed。三处改动:
#   ① publish_track.py 推送间隔 180s → 3600s(每小时, 需在扫描机上同步)
#      → 间隔 1 小时 >> 单次部署 3-8 分钟, 从源头上不可能再撞车
#   ② 保留 paths-ignore —— 扫描机是独立机器, 无法保证它一定同步了 ①。
#      保留后, 不论那台机是 3 分钟还是 1 小时推一次, 都不会触发部署,
#      发布统一由 schedule 承担。这样本 workflow 不依赖外部机器的状态。
#   ③ schedule 每 30 分钟 → 每小时 —— run 数量减半, 数据最多滞后 1 小时,
#      与 ① 的推送节奏一致(用户 2026-08-07 定: 每小时更新结果即可)。
#   ④ cancel-in-progress: true —— 万一仍有重叠, 旧 run 被"取消"而不是
#      卡在 deployment_queued 直到超时。cancelled 不发邮件, failure 才发。
#
# 注: "Failed to resolve action download info: Service Unavailable" 是 GitHub
# 侧临时故障, workflow 内无法根治, 只能靠把 run 总数从 480/天降到 ~24/天
# 来降低撞上的概率。若仍偶发, 在 https://github.com/settings/notifications
# 取消勾选 Actions 的失败通知即可彻底静音。

on:
  push:
    branches: [main]
    paths-ignore:
      - 'track-bc3252772c/**'      # 足球盘口实时数据, 由下面的 schedule 统一发布
  schedule:
    - cron: '0 * * * *'            # 每小时发布一次(含最新 track.json)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true         # 重叠时取消旧 run(cancelled 不发失败邮件)

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出(浅克隆, 仓库历史较大)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/configure-pages@v5

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 10
