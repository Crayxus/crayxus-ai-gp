name: Deploy Pages

# 自定义 Pages 部署 —— 取代 GitHub 内置构建(legacy)。
#
# 起因(2026-08-06): track-bc3252772c/track.json 每 3 分钟被外部脚本推送一次。
#
# 第一次尝试(concurrency + cancel-in-progress:false)只治住了 Actions 层:
# 部署不再互相中断了, 但 Pages 部署 API 本身是串行的 —— 推送间隔 3 分钟 <
# 单次部署耗时, 队列越排越长, 每个 run 卡在 deployment_queued 直到
# "Timeout reached, aborting!" → 仍然是 failure。
#
# 真正的解法: 数据推送不再触发部署, 改由定时任务统一发布。
#   - paths-ignore  → track.json 推送不再触发(把 480 次/天降到 0)
#   - schedule      → 每 30 分钟发布一次, 数据最多滞后 30 分钟
#   - 页面/代码改动 → 照常即时部署
#
# 若需要立刻发布最新数据: Actions 页面手动 Run workflow。

on:
  push:
    branches: [main]
    paths-ignore:
      - 'track-bc3252772c/**'      # 足球盘口实时数据, 由定时任务统一发布
  schedule:
    - cron: '*/30 * * * *'         # 每 30 分钟发布一次(含最新 track.json)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false      # 排队, 不中断进行中的部署

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出(浅克隆, 仓库历史较大)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/configure-pages@v5

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 15
