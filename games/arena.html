let mixer,actions={},activeName=null,finHandler=null;
const ONESHOT=new Set(['Jump','Yes','No','Wave','Punch','ThumbsUp']);
function play(name){
  const next=actions[name]; if(!next) return;
  if(activeName===name && !ONESHOT.has(name)) return;
  const prev=actions[activeName];
  if(prev&&prev!==next) prev.fadeOut(0.25);
  next.reset().setEffectiveWeight(1).fadeIn(0.25).play();
  if(ONESHOT.has(name)||name==='Death'){next.setLoop(THREE.LoopOnce,1);next.clampWhenFinished=true;}
  else next.setLoop(THREE.LoopRepeat,Infinity);
  activeName=name;
}
function gesture(name){
  play(name);
  if(ONESHOT.has(name)&&mixer){
    if(finHandler) mixer.removeEventListener('finished',finHandler);
    finHandler=()=>{mixer.removeEventListener('finished',finHandler);finHandler=null;play('Idle');};
    mixer.addEventListener('finished',finHandler);
  }
}

const DEFAULT_API='https://drum-improvements-spine-faces.trycloudflare.com';
function resolveApi(){
  const q=new URLSearchParams(location.search).get('api');
  if(q){const a=q.replace(/\/+$/,'');try{localStorage.setItem('alphadan_api',a)}catch(e){}return a;}
  if(location.protocol==='file:')return 'http://127.0.0.1:8001';
  if(/crayxus\.com\.au$|\.github\.io$/i.test(location.hostname)){
    let s=null;try{s=localStorage.getItem('alphadan_api')}catch(e){}
    return s||DEFAULT_API;
  }
  return location.origin;
}

const SUITS={0:'♠',1:'♥',2:'♣',3:'♦'};
const VALN={3:'3',4:'4',5:'5',6:'6',7:'7',8:'8',9:'9',10:'10',11:'J',12:'Q',13:'K',14:'A',15:'2',16:'小王',17:'大王'};
const WILD_UID=25;                       // 红桃2 百搭
function uidInfo(uid){
  if(uid===52)return{label:'小王',suit:'★',red:false,joker:true,rank:16,suitIdx:4};
  if(uid===53)return{label:'大王',suit:'★',red:true,joker:true,rank:17,suitIdx:4};
  const s=Math.floor(uid/13),v=(uid%13)+3;
  return{label:VALN[v],suit:SUITS[s],red:(s===1||s===3),joker:false,rank:v,suitIdx:s};
}
function flatSort(counts){               // 大→小（你确认的标准排法）
  const out=[];
  for(let uid=0;uid<54;uid++)for(let i=0;i<counts[uid];i++)out.push(uid);
  out.sort((a,b)=>{const A=uidInfo(a),B=uidInfo(b);
    if(A.rank!==B.rank)return B.rank-A.rank; return A.suitIdx-B.suitIdx;});
  return out;
}

let aiVoice=null,meVoice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  const zh=vs.filter(v=>/zh|chinese/i.test(v.lang+v.name));
  const find=ns=>{for(const n of ns){const f=zh.find(v=>v.name.toLowerCase().includes(n));if(f)return f;}return null;};
  aiVoice=find(['yunjian','yunxi','yunyang','kangkang'])||zh[0]||vs[0]||null;
  meVoice=find(['xiaoxiao','xiaoyi','xiaochen','yaoyao','huihui'])||zh.find(v=>v!==aiVoice)||aiVoice;
}
speechSynthesis.onvoiceschanged=pickVoice;pickVoice();
const pick=a=>a[Math.floor(Math.random()*a.length)];
let _speaking=false;const _sQ=[];
function say(text,who){
  const b=who==='ai'?$("aiBubble"):$("meBubble");
  if(b){b.textContent=text;b.classList.add("show");clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove("show"),2200);}
  _sQ.push({text,who});if(_sQ.length>3)_sQ.shift();
  if(!_speaking)_drain();
}
function _drain(){
  if(_sQ.length===0){_speaking=false;return;}
  _speaking=true;const it=_sQ.shift();
  let done=false;const finish=()=>{if(done)return;done=true;_speaking=false;_drain();};
  const to=setTimeout(finish,Math.min(5000,800+it.text.length*230));
  try{
    const u=new SpeechSynthesisUtterance(it.text);u.lang="zh-CN";u.rate=1.02;u.pitch=(it.who==='ai'?0.82:1.06);
    const vv=(it.who==='ai'?aiVoice:meVoice);if(vv)u.voice=vv;
    u.onend=()=>{clearTimeout(to);finish();};u.onerror=()=>{clearTimeout(to);finish();};
    speechSynthesis.speak(u);
  }catch(e){clearTimeout(to);finish();}
}

function cardEl(uid){

  const d=document.createElement("div");
  d.className="card "+(c.red?"red ":"")+(c.joker?"joker ":"")+(uid===WILD_UID?"wild":"");

/* ---- 手牌渲染（沿用标准排法：大→小、同点竖列、整列全选、超宽整体缩放）---- */
function render(){
  if(!state)return;
  $("aiCount").textContent=state.counts[1];$("meCount").textContent=state.counts[0];
  // 报牌警示：≤10张亮出醒目剩牌数
  const an=state.counts[1],mn=state.counts[0];
  const aL=$("aiLowB"),mL=$("meLowB");
  if(!state.game_over&&an>0&&an<=10){aL.innerHTML='⚠ AlphaDan 只剩 <b>'+an+'</b> 张';aL.style.display='block';}
  else aL.style.display='none';
  if(!state.game_over&&mn>0&&mn<=10){mL.innerHTML='你只剩 <b>'+mn+'</b> 张';mL.style.display='block';}
  else mL.style.display='none';
  const h=$("hand");h.innerHTML="";
  const sorted=flatSort(state.my_hand);      // tokens = uid#序号
  const cardW=56,cardH=80,colStep=40,upStep=26,BTN=22;
  let x=0,prevR=null,colN=0,maxY=0;
  const items=[],cols=[];
  sorted.forEach((uid,idx)=>{
    const r=uidInfo(uid).rank;
    if(r!==prevR){if(prevR!==null)x+=colStep;prevR=r;colN=0;cols.push({x,tokens:[]});}
    else colN++;
    const y=colN*upStep;if(y>maxY)maxY=y;
    const token=uid+'#'+idx;
    items.push({uid,token,x,y,colN});cols[cols.length-1].tokens.push(token);
  });
  const totalW=x+cardW;
  const cw=stageEl.clientWidth;
  const availW=Math.max(120,cw-12);
  const scale=Math.min(1,availW/totalW);
  h.style.width=totalW+"px";
  h.style.height=(BTN+cardH+maxY+34)+"px";
  // 显式数学居中(负margin):手牌超宽时部分浏览器的flex居中会退化成
  // 左对齐,缩放锚点随之偏移导致右侧被裁——不依赖flex,自己定位。
  const mx=Math.round((cw-totalW)/2);
  h.style.marginLeft=mx+"px";h.style.marginRight=mx+"px";
  h.style.transform="scale("+scale+")";h.style.transformOrigin="bottom center";
  const myTurn=(state.turn===state.my_seat)&&!state.game_over;
  for(const it of items){
    const el=cardEl(it.uid);
    el.style.left=it.x+"px";
    el.style.bottom=(BTN+(selected.has(it.token)?30:0)+it.y)+"px";
    el.style.zIndex=String(selected.has(it.token)?300:(60-it.colN));
    if(selected.has(it.token))el.classList.add('sel');
    el.onclick=()=>{if(!myTurn||busy)return;selected.has(it.token)?selected.delete(it.token):selected.add(it.token);render();};
    h.appendChild(el);
  }
  for(const col of cols){
    const allSel=col.tokens.every(t=>selected.has(t));
    const b=document.createElement("div");
    b.className="colbtn"+(allSel?" on":"");
    b.style.left=(col.x+(cardW-34)/2)+"px";b.style.width="34px";
    b.textContent=allSel?"✓":"全";
    b.onclick=()=>{if(!myTurn||busy)return;const all=col.tokens.every(t=>selected.has(t));col.tokens.forEach(t=>all?selected.delete(t):selected.add(t));render();};
    h.appendChild(b);
  }
  $("playBtn").disabled=!(myTurn&&!busy&&selected.size>0);
  $("passBtn").disabled=!(myTurn&&!busy&&state.last_hand!==null);
  $("hintBtn").disabled=!(myTurn&&!busy);
}

/* ---- API ---- */
async function api(path,body,method='POST'){
  const opt={method,headers:{'Content-Type':'application/json'}};
  if(body)opt.body=JSON.stringify(body);
  const res=await fetch(API+path,opt);
  if(!res.ok){let e=await res.text();try{e=JSON.parse(e).error||e;}catch{}throw new Error(e);}
  return res.json();
}

  (function tick(){
    const el=(performance.now()-thinkT0)/1000;
    fill.style.height=Math.min(96,100*(1-Math.exp(-el/3.5)))+'%';
    sec.textContent=el.toFixed(0)+'s';
    thinkRAF=requestAnimationFrame(tick);
  })();
}
function endThink(){
  if(thinkRAF){cancelAnimationFrame(thinkRAF);thinkRAF=null;}
  const box=$("thinkBox"),fill=$("tbFill");
  fill.style.height='100%';
  setTimeout(()=>{box.classList.remove('busy');fill.style.height='0%';},240);
}

/* ---- 对局流程 ---- */
async function newGame(){
  endThink();_sQ.length=0;_speaking=false;try{speechSynthesis.cancel()}catch(e){}
  selected.clear();$("played").innerHTML="";note("");
  $("over").classList.remove("show");
  try{
    busy=true;setStatus("发牌中…");
    const isOwner=new URLSearchParams(location.search).get('owner')==='1';
    if(isOwner)try{localStorage.setItem('alphadan_owner','1')}catch(e){}
    let owner=isOwner;try{owner=owner||localStorage.getItem('alphadan_owner')==='1'}catch(e){}
    state=await api('/1v1/new_game',{first:'random',reveal:false,human_seat:0,source:owner?'':'arena'});
    sessionId=state.session_id;
    busy=false;rgest('Idle');render();
    say(pick(OPENING),'ai');
    if(state.turn!==state.my_seat){setStatus("AlphaDan 先手");setTimeout(aiTurn,600);}
    else setStatus("你先出牌");
  }catch(e){busy=false;setStatus("连接失败");toast('无法连接 AI：'+e.message);}
}

function rankKey(arr){return arr.map(u=>uidInfo(u).rank).sort((a,b)=>a-b).join(',');}
async function snapToLegal(selUids){
  // 按点数集合吸附到服务器合法出法：选花色不同也不挡合法牌型
  const r=await api('/1v1/legal_moves',{session_id:sessionId});
  const selKey=rankKey(selUids);
  const cands=(r.legal_moves||[]).filter(m=>m.length===selUids.length&&rankKey(m)===selKey);
  if(cands.length===0)return null;
  const selSet=new Set(selUids);
  let best=cands[0],bestOv=-1;
  for(const m of cands){const ov=m.filter(u=>selSet.has(u)).length;if(ov>bestOv){bestOv=ov;best=m;}}
  return best;
}

async function playerPlay(){
  if(busy||!state||state.turn!==state.my_seat||state.game_over)return;
  const uids=[...selected].map(t=>parseInt(t.split('#')[0]));
  if(uids.length===0)return;
  busy=true;
  try{
    const snapped=await snapToLegal(uids);
    if(!snapped){busy=false;toast('这组牌不构成可出的牌型');return;}
    const wasBeat=(state.last_hand!==null);
    state=await api('/1v1/play_move',{session_id:sessionId,move_uids:snapped});
    selected.clear();
    const lh=state.last_hand||{};
    showPlayed(snapped,'me',lh.type);
    say(reportLine(lh.type,lh.val,'me',wasBeat),'me');
    if(BOOMT.has(lh.type))setTimeout(()=>{if(!state.game_over)rgest('No');},650); // 你砸炸弹，它摇头
    busy=false;render();
    if(state.game_over)return endGame();
    setTimeout(aiTurn,500);
  }catch(e){busy=false;toast(e.message);render();}
}

async function playerPass(){
  if(busy||!state||state.turn!==state.my_seat||state.game_over||state.last_hand===null)return;
  busy=true;
  try{
    state=await api('/1v1/play_move',{session_id:sessionId,move_uids:[]});
    say(pick(PASSLN),'me');note("你：要不起");
    selected.clear();busy=false;render();
    if(state.game_over)return endGame();
    setTimeout(aiTurn,400);
  }catch(e){busy=false;toast(e.message);render();}
}

async function aiTurn(){
  if(busy||!state||state.game_over||state.turn===state.my_seat)return;
  busy=true;startThink();render();
  try{
    const hadLast=(state.last_hand!==null&&state.last_hand_owner===state.my_seat);
    const r=await api('/1v1/ai_move',{session_id:sessionId});
    endThink();state=r;
    const mv=r.ai_move||[];
    if(mv.length===0){
      rgest('No');say(pick(PASSLN),'ai');note("AlphaDan：要不起");
    }else{
      const lh=r.last_hand||{};
      showPlayed(mv,'ai',lh.type);
      rgest(EMOTE[lh.type]||'Wave');
      let line=reportLine(lh.type,lh.val,'ai',hadLast);
      const an=state.counts[1];
      if(an>0&&an<=10)line+='，剩'+an+'张';   // 掼蛋报牌
      say(line,'ai');
    }
    busy=false;render();
    if(state.game_over)return endGame();
    if(state.turn!==state.my_seat){setTimeout(aiTurn,500);return;}
    setStatus(state.last_hand===null?"你领出":"轮到你");
  }catch(e){
    endThink();busy=false;
    setStatus("AI 掉线");toast('AI 出招失败：'+e.message);
  }
}

async function hint(){
  if(busy||!state||state.turn!==state.my_seat||state.game_over)return;
  try{
    const r=await api('/1v1/legal_moves',{session_id:sessionId});
    const moves=(r.legal_moves||[]).filter(m=>m.length>0);
    if(moves.length===0){toast('没有能压的牌，点「不要」');selected.clear();render();return;}
    moves.sort((a,b)=>a.length-b.length||
      Math.max(...a.map(u=>uidInfo(u).rank))-Math.max(...b.map(u=>uidInfo(u).rank)));
    const mv=moves[0];
    selected.clear();
    const need={};mv.forEach(u=>need[u]=(need[u]||0)+1);
    flatSort(state.my_hand).forEach((uid,idx)=>{
      if(need[uid]>0){selected.add(uid+'#'+idx);need[uid]--;}
    });
    render();
  }catch(e){toast(e.message);}
}

function endGame(){
  render();
  const iWin=(state.winner===state.my_seat);
  recordResult(iWin?'me':'ai');
  if(window.RBT&&RBT.ready)iWin?RBT.play('Death'):RBT.play('Dance');
  if(iWin){say(pick(WIN_ME),'me');setTimeout(()=>say(pick(LOSE_AI),'ai'),1500);}
  else say(pick(WIN_AI),'ai');
  $("overText").textContent=iWin?"你赢了":"AI 获胜";
  $("overText").style.color=iWin?"#5ee6ff":"#ff2d40";
  $("overSub").textContent=iWin?("AlphaDan 还剩 "+state.counts[1]+" 张"):("你还剩 "+state.counts[0]+" 张");
  $("over").classList.add("show");
}

/* ---- 入口 ---- */
$("playBtn").onclick=playerPlay;$("passBtn").onclick=playerPass;
$("hintBtn").onclick=hint;$("newBtn").onclick=()=>{if(!busy)newGame();};
$("overBtn").onclick=newGame;
// 赛事：一键直跳 indexrp 大厅(AI服务器同源,局域网/隧道/线上均可达)
$("eventBtn").onclick=()=>{location.href=API+'/indexrp';};
renderStats();

(async function checkHealth(){
  const el=$("introReady");
  const probe=async base=>{
    const r=await fetch(base+'/1v1/health');if(!r.ok)throw 0;return r.json();
  };
  try{
    const h=await probe(API);
    el.textContent='AI 核心在线 · '+h.sims+' 次推演/手';el.className='ready ok';
  }catch(e){
    if(API!==DEFAULT_API){                      // 记住的旧地址失效→回退默认隧道
      try{
        const h=await probe(DEFAULT_API);
        API=DEFAULT_API;try{localStorage.removeItem('alphadan_api')}catch(e2){}
        el.textContent='AI 核心在线 · '+h.sims+' 次推演/手';el.className='ready ok';
        return;
      }catch(e2){}
    }
    el.textContent='AI 核心未连接 — 主机可能休息了，稍后再来';el.className='ready bad';
  }
})();
$("introBtn").onclick=()=>{
  try{const u=new SpeechSynthesisUtterance(' ');speechSynthesis.speak(u);}catch(e){}
  $("intro").classList.add('hide');
  newGame();
};
if(location.hash==='#auto')setTimeout(()=>$("introBtn").onclick(),1500); // 自动化测试钩子
if(location.hash==='#dbg')setTimeout(()=>{$("intro").classList.add('hide');
  $("status").textContent=[innerWidth,document.documentElement.clientWidth,
    document.documentElement.scrollWidth,(visualViewport&&visualViewport.scale||1).toFixed(2),
    document.getElementById('stage').clientWidth].join('/');
  $("thinkBox").classList.add('busy');$("tbFill").style.height='62%';$("thinkCount").textContent='4s';
  $("aiLowB").innerHTML='⚠ AlphaDan 只剩 <b>3</b> 张';$("aiLowB").style.display='block';
  $("meLowB").innerHTML='你只剩 <b>7</b> 张';$("meLowB").style.display='block';},2500);
</script>
